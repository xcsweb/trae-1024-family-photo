<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRAE 社区 · 1024 全家福</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #080b11;
    color: #e6edf3;
    font-family: "PingFang SC", "SF Pro Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* ---------- 顶栏 ---------- */
  .topbar {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 12px 20px;
    background: rgba(11, 16, 22, .94);
    border-bottom: 1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(8px);
    z-index: 40;
  }
  .title { font-size: 16px; font-weight: 600; letter-spacing: .5px; }
  .title em { color: #0FDC78; font-style: normal; }
  .sub { font-size: 12px; color: #8b98a5; }
  .sub b { color: #e6edf3; font-weight: 600; }
  .spacer { flex: 1 1 auto; }
  .tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .search { position: relative; display: flex; align-items: center; }
  .search input {
    width: 190px; height: 34px;
    padding: 0 30px 0 32px;
    color: #e6edf3; background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.14); border-radius: 999px;
    font-size: 13px; outline: none; transition: border-color .15s, width .2s;
  }
  .search input:focus { border-color: #0FDC78; width: 230px; }
  .search svg { position: absolute; left: 11px; width: 14px; height: 14px; color: #8b98a5; }
  .search .clear {
    position: absolute; right: 8px; width: 20px; height: 20px; line-height: 18px;
    text-align: center; border-radius: 50%; cursor: pointer; color: #8b98a5;
    background: rgba(255,255,255,.08); font-size: 13px; display: none;
  }
  .search.has-value .clear { display: block; }

  button {
    height: 34px; padding: 0 14px; cursor: pointer;
    color: #e6edf3; background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.14); border-radius: 999px;
    font-size: 13px; font-family: inherit; transition: all .15s;
  }
  button:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.28); }
  .modes { display: flex; gap: 4px; padding: 3px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.10); }
  .modes button { height: 28px; border: none; background: transparent; }
  .modes button.on { color: #04331c; font-weight: 600; background: #0FDC78; }
  .modes button.on:hover { background: #32F08C; }
  button.solid { color: #04331c; font-weight: 600; background: #0FDC78; border-color: #0FDC78; }
  button.solid:hover { background: #32F08C; border-color: #32F08C; }

  .zoom { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #8b98a5; }
  .zoom input { width: 80px; accent-color: #0FDC78; }

  /* ---------- 舞台 ---------- */
  #viewport {
    flex: 1 1 auto; position: relative; overflow: auto;
    padding: 18px; overscroll-behavior: contain;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(15,220,120,.08), transparent 70%),
      linear-gradient(180deg, #080b11 0%, #0a0d14 100%);
  }
  .zoomWrap { position: relative; margin: 0 auto; }
  #stage {
    position: relative;
    transform-origin: top left;
    background: #0a0e18;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,.10);
    box-shadow: 0 24px 80px rgba(0,0,0,.6);
    overflow: hidden;
  }
  body[data-mode="globe"] #stage { cursor: grab; }
  body[data-mode="globe"] #stage.dragging { cursor: grabbing; }

  #bg { position: absolute; inset: 0; display: block; z-index: 0; }
  #links { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .lnk {
    fill: none; stroke: rgba(15, 220, 120, .17); stroke-width: 1;
    transition: stroke .18s ease, stroke-width .18s ease;
  }
  .lnk.hot { stroke: rgba(15, 220, 120, .92); stroke-width: 1.7; }
  #linksHot { fill: none; stroke: rgba(15, 220, 120, .92); stroke-width: 1.7; }

  #globe { position: absolute; inset: 0; display: none; z-index: 1; pointer-events: none; }
  #flow { position: absolute; inset: 0; display: none; z-index: 1; pointer-events: none; }
  body[data-mode="flow"] #flow { display: block; }
  #flowGL { position: absolute; inset: 0; display: none; z-index: 2; pointer-events: none; }
  body[data-mode="flow"].flow-canvas #flowGL { display: block; }
  /* 星流自带渐变底与点彩层，旧背景/连线层在这一形态里关掉，减少合成开销 */
  body[data-mode="flow"] #bg { display: none; }
  body[data-mode="flow"] #links { display: none; }
  #fx { position: absolute; inset: 0; display: none; z-index: 800; pointer-events: none; }

  .starDot {
    position: absolute; z-index: 0; border-radius: 50%;
    background: #fff; pointer-events: none;
    animation: twinkle var(--dur, 4s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }
  @keyframes twinkle {
    0%, 100% { opacity: var(--o, .35); transform: scale(.7); }
    50%      { opacity: 1; transform: scale(1.2); }
  }
  .shooting {
    position: absolute; z-index: 0; width: 150px; height: 2px;
    pointer-events: none; opacity: 0;
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.95));
    filter: drop-shadow(0 0 6px rgba(15,220,120,.85));
    animation: shoot var(--dur, 11s) linear infinite;
    animation-delay: var(--delay, 0s);
  }
  @keyframes shoot {
    0%   { opacity: 0; transform: translate(0, 0) rotate(17deg) scaleX(.35); }
    5%   { opacity: 1; }
    16%  { opacity: 0; transform: translate(420px, 132px) rotate(17deg) scaleX(1); }
    100% { opacity: 0; transform: translate(420px, 132px) rotate(17deg) scaleX(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .starDot, .shooting { animation: none; }
    .starDot { opacity: var(--o, .35); }
  }

  .banner {
    position: absolute; top: 0; left: 0; right: 0; height: 92px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    pointer-events: none; z-index: 900;
  }
  .banner h1 {
    margin: 0; font-size: 25px; font-weight: 700; letter-spacing: 2px;
    color: #eafff4; text-shadow: 0 2px 24px rgba(15,220,120,.5);
  }
  .banner h1 span { color: #0FDC78; }
  .banner p { margin: 0; font-size: 12px; color: #8b98a5; letter-spacing: 1px; }

  /* ---------- 倒计时版式：每秒重排，缩短过渡避免赶/闪 ---------- */
  body[data-mode="countdown"] .p { transition-duration: .55s; }

  body.memorial #stage {
    box-shadow: 0 24px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(15,220,120,.4), 0 0 60px rgba(15,220,120,.16);
  }

  /* ---------- 点火 ---------- */
  .lit .p .avatar::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(15,220,120,0) 38%, rgba(15,220,120,.5) 76%, rgba(15,220,120,.95) 100%);
    opacity: 0; animation: litpop 1.2s ease-out forwards;
    animation-delay: var(--lit-delay, 0ms);
  }
  @keyframes litpop { 0% { opacity: 0 } 35% { opacity: 1 } 100% { opacity: .45 } }

  /* ---------- 人物 ---------- */
  .p {
    position: absolute; left: 0; top: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    transition: transform .9s cubic-bezier(.22,.68,.28,1);
    will-change: transform;
  }
  body[data-mode="globe"] .p { visibility: hidden; pointer-events: none; }
  /* 星流：逐帧写 transform，必须关掉 CSS 过渡，否则会拖影 */
  body[data-mode="flow"] .p {
    transition: none;
    z-index: 3;
    contain: layout style;
    backface-visibility: hidden;
  }
  body[data-mode="flow"] .p .avatar {
    transition: none;
    border-radius: 50%;
    border-width: 1px;
    border-color: rgba(234,255,244,.26);
    box-shadow: 0 0 8px rgba(0,0,0,.45);
  }
  body[data-mode="flow"] .p .nm { opacity: 0 !important; }
  /* 帧率不足时自动切到画布渲染：600 个 DOM 层直接不参与合成（坐标仍逐帧同步在 JS 里，导出照常） */
  body[data-mode="flow"].flow-canvas .p { display: none; }
  /* 图片收束：每格用 cover 裁切，格子是方的 */
  body[data-mode="flow"].flow-image .p .avatar,
  body[data-mode="flow"].flow-preset .p .avatar {
    border-radius: 2px;
    border-color: rgba(255,255,255,.06);
    box-shadow: none;
  }
  body[data-mode="flow"].flow-image .p .avatar img,
  body[data-mode="flow"].flow-preset .p .avatar img {
    object-fit: cover;
    image-rendering: auto;
  }
  /* 名画/图片收束：给每块头像叠一层主色调（color 混合保留明暗）——
     头像本身的热烈配色会把画面搅成彩噪，薄薄一层后整幅画的结构才读得出来 */
  .p .avatar .tint { display: none; }
  body[data-mode="flow"].flow-image .p .avatar,
  body[data-mode="flow"].flow-preset .p .avatar { isolation: isolate; }
  body[data-mode="flow"].flow-image .p .avatar img,
  body[data-mode="flow"].flow-preset .p .avatar img { mix-blend-mode: soft-light; }

  .p .avatar {
    position: relative;
    width: var(--sz, 48px); height: var(--sz, 48px);
    border-radius: 50%; overflow: hidden;
    background: #16202c;
    border: 2px solid rgba(255,255,255,.82);
    box-shadow: 0 5px 16px rgba(0,0,0,.5);
    transition: width .9s cubic-bezier(.22,.68,.28,1), height .9s cubic-bezier(.22,.68,.28,1),
                box-shadow .25s, border-color .25s;
  }
  .p .avatar img { width: 100%; height: 100%; display: block; object-fit: cover; }

  /* 星座模式：每颗都是一盏星 */
  body[data-mode="constellation"] .p .avatar {
    border-color: rgba(234,255,244,.6);
    box-shadow: 0 0 10px rgba(15,220,120,.5), 0 0 26px rgba(15,220,120,.22);
  }
  body[data-mode="constellation"] .p:hover .avatar,
  body[data-mode="constellation"] .p.hit .avatar {
    box-shadow: 0 0 0 3px rgba(15,220,120,.55), 0 0 26px rgba(15,220,120,.85);
  }

  /* 切 tab 的错峰飞行窗口（body.p-moving，约 1.1s）：600 个头像的阴影/描边临时降一档，
     减少飞行中的重复光栅化面积；窗口结束摘掉类即恢复原样。悬停/搜索命中者不降级 */
  body.p-moving .p:not(:hover):not(.hit) .avatar {
    box-shadow: 0 3px 8px rgba(0, 0, 0, .4);
    border-width: 1px;
  }

  .p .nm {
    margin-top: 3px; max-width: calc(var(--sz, 48px) + 30px);
    font-size: 10px; line-height: 13px; color: #b9c6d3; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  body[data-mode="constellation"] .p .nm,
  body[data-mode="pixel"] .p .nm { opacity: 0; }
  body .p:hover .nm, body .p.hit .nm { opacity: 1; }

  .p:hover { z-index: 950 !important; }
  .p.hit { z-index: 951 !important; }
  .p:hover .avatar { border-color: #0FDC78; }
  .p.hit .avatar {
    border-color: #0FDC78;
    box-shadow: 0 0 0 4px rgba(15,220,120,.85), 0 0 26px rgba(15,220,120,.7);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .p.hit .nm { color: #0FDC78; font-weight: 600; }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 4px rgba(15,220,120,.85), 0 0 26px rgba(15,220,120,.7); }
    50%     { box-shadow: 0 0 0 9px rgba(15,220,120,.22), 0 0 34px rgba(15,220,120,.35); }
  }

  /* ---------- 主角模式（倒计时 tab 内的形态，不占 tab） ---------- */
  /* 方块化 + 无滤镜：整面墙的颜色全部来自每位成员头像自己的主色调，靠"选人"而不是"调色"拼出人像 */
  body[data-mode="hero"] .p .avatar {
    border-radius: 3px;
    border-width: 1px;
    border-color: rgba(255,255,255,.08);
    box-shadow: none;
  }
  body[data-mode="hero"] .p { transition-duration: .85s; }

  #heroCard {
    position: absolute; z-index: 6; display: none;
    padding: 22px 22px 16px;
    background: linear-gradient(180deg, rgba(13,20,28,.95), rgba(9,14,20,.95));
    border: 1px solid rgba(15,220,120,.34); border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.65);
    backdrop-filter: blur(6px);
  }
  body[data-mode="hero"] #heroCard { display: block; }
  #heroCard .hcTop { display: flex; align-items: center; gap: 16px; }
  #heroCard .hcAv {
    width: 82px; height: 82px; flex: 0 0 auto; border-radius: 50%; overflow: hidden;
    border: 3px solid rgba(15,220,120,.85);
    box-shadow: 0 0 24px rgba(15,220,120,.32); background: #16202c;
  }
  #heroCard .hcAv img { width: 100%; height: 100%; display: block; object-fit: cover; }
  #heroCard .hcName { font-size: 26px; font-weight: 700; color: #eafff4; letter-spacing: .5px; }
  #heroCard .hcUser { font-size: 15px; color: #7f8c99; margin-top: 3px; }
  #heroCard .hcBadges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  #heroCard .hcBadge {
    font-size: 13px; line-height: 22px; padding: 0 10px; border-radius: 999px;
    color: #0FDC78; background: rgba(15,220,120,.12); border: 1px solid rgba(15,220,120,.40);
  }
  #heroCard .hcBadge.plain { color: #9fb0bf; background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.16); }
  #heroCard .hcDid { margin-top: 18px; border-top: 1px solid rgba(255,255,255,.10); padding-top: 14px; }
  #heroCard .hcTitle { font-size: 15px; color: #0FDC78; letter-spacing: 1px; margin-bottom: 10px; }
  #heroCard .hcList { list-style: none; margin: 0; padding: 0; }
  #heroCard .hcList li {
    font-size: 16px; line-height: 24px; color: #c8d4e0; margin-bottom: 9px;
    display: flex; gap: 8px; align-items: baseline;
  }
  #heroCard .hcList li .dot { color: #0FDC78; flex: 0 0 auto; }
  #heroCard .hcList li .tx { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #heroCard .hcList li .mt { color: #7f8c99; font-size: 13px; flex: 0 0 auto; }
  #heroCard .hcFoot {
    margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.10);
    display: flex; align-items: center; gap: 12px; justify-content: space-between;
  }
  #heroCard .hcFoot span { font-size: 13px; color: #66717c; line-height: 18px; }
  #heroCard .hcFoot button { font-size: 13px; height: 30px; flex: 0 0 auto; }
  #heroCard .hcPrec { margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.10); }
  #heroCard .hcPrec .prTop { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  #heroCard .hcPrec .prTop b { font-size: 15px; color: #0FDC78; letter-spacing: 1px; font-weight: 600; }
  #heroCard .hcPrec .prTop i { font-size: 12px; color: #7f8c99; font-style: normal; }
  #heroCard .hcPrec input[type=range] {
    width: 100%; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 999px;
    background: rgba(255,255,255,.14); outline: none; cursor: pointer;
  }
  #heroCard .hcPrec input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: #0FDC78; box-shadow: 0 0 10px rgba(15,220,120,.60);
  }
  #heroCard .hcPrec input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px; border: 0; border-radius: 50%;
    background: #0FDC78; box-shadow: 0 0 10px rgba(15,220,120,.60);
  }
  #heroCard .hcPrec .prMarks { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: #5d6a75; }
  #heroCard .hcPrec .prMarks span.on { color: #0FDC78; }

  /* ---------- 星流控制台：舞台底部通栏（不压画面） ---------- */
  #flowBar {
    position: absolute; z-index: 940; display: none;
    left: 0; right: 0; bottom: 0; height: 164px;
    flex-direction: column; gap: 6px;
    padding: 8px 18px 9px;
    background: linear-gradient(180deg, rgba(9,14,20,.78), rgba(7,11,16,.97));
    border-top: 1px solid rgba(15,220,120,.32);
    box-shadow: 0 -14px 44px rgba(0,0,0,.55);
    backdrop-filter: blur(10px);
  }
  body[data-mode="flow"] #flowBar { display: flex; }
  #flowBar .fbHead { display: flex; align-items: center; gap: 12px; flex: 0 0 auto; }
  #flowBar .fbTitle { font-size: 12px; color: #0FDC78; letter-spacing: 1px; }
  #flowBar .fbLevel { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  #flowBar .fbLevel > span { font-size: 11px; color: #8b98a5; margin-right: 2px; }
  #flowBar .fbLevel button {
    height: 22px; padding: 0 9px; font-size: 11px; border-radius: 7px;
    border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04);
    color: #9fb0bf; flex: 0 0 auto;
  }
  #flowBar .fbLevel button:hover { border-color: rgba(15,220,120,.5); color: #eafff4; }
  #flowBar .fbLevel button.on { color: #04331c; background: #0FDC78; border-color: #0FDC78; font-weight: 600; }
  #flowBar .fbLevel i { font-style: normal; font-size: 11px; color: #66717c; margin-left: 6px; white-space: nowrap; }
  #flowBar .fbRow { display: flex; gap: 6px; align-items: center; flex: 0 0 auto; }
  #flowBar input[type=text] {
    flex: 1 1 auto; min-width: 0; height: 28px; padding: 0 10px;
    color: #eafff4; background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.16); border-radius: 8px;
    font-size: 13px; font-family: inherit; outline: none;
  }
  #flowBar input[type=text]:focus { border-color: #0FDC78; }
  #flowBar button { height: 28px; padding: 0 11px; font-size: 12px; flex: 0 0 auto; }
  #flowBar .fbRow .grow { flex: 1 1 auto; }
  #flowBar .fbGallery {
    flex: 1 1 auto; min-height: 0; display: flex; align-items: center;
    gap: 8px; overflow-x: auto; overflow-y: hidden;
  }
  #flowBar .fbGallery::-webkit-scrollbar { height: 4px; }
  #flowBar .fbGallery::-webkit-scrollbar-thumb { background: rgba(15,220,120,.4); border-radius: 4px; }
  #flowBar .fbItem {
    flex: 0 0 auto; width: 58px; cursor: pointer; text-align: center;
    padding: 3px 3px 4px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,.10); background: rgba(255,255,255,.03);
    transition: border-color .15s, background .15s;
  }
  #flowBar .fbItem:hover { border-color: rgba(15,220,120,.55); background: rgba(15,220,120,.08); }
  #flowBar .fbItem.on { border-color: #0FDC78; background: rgba(15,220,120,.14); }
  #flowBar .fbItem img {
    width: 44px; height: 42px; display: block; margin: 0 auto 3px;
    border-radius: 4px; background: #0B1117; image-rendering: auto;
  }
  #flowBar .fbItem span {
    display: block; font-size: 10px; line-height: 12px; color: #9fb0bf;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #flowBar .fbItem.on span { color: #0FDC78; }
  #flowBar .fbNote {
    flex: 0 0 auto; font-size: 11px; line-height: 14px; color: #66717c;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #flowBar .fbNote b { color: #b9c6d3; font-weight: 600; }

  /* ---------- 快门闪光 ---------- */
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 60; }
  #flash.on { animation: shutter .42s ease-out; }
  @keyframes shutter { 0% { opacity: 0 } 12% { opacity: .92 } 100% { opacity: 0 } }

  /* ---------- 悬停信息卡 ---------- */
  #tip {
    position: fixed; z-index: 70; pointer-events: none;
    min-width: 130px; max-width: 240px; padding: 9px 12px;
    background: rgba(11,16,22,.97);
    border: 1px solid rgba(15,220,120,.45); border-radius: 10px;
    box-shadow: 0 12px 34px rgba(0,0,0,.6);
    opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s;
  }
  #tip.on { opacity: 1; transform: translateY(0); }
  #tip .t1 { font-size: 13px; font-weight: 600; color: #eafff4; }
  #tip .t2 { font-size: 11px; color: #7f8c99; margin-top: 2px; }
  #tip .t3 { font-size: 11px; color: #0FDC78; margin-top: 4px; }
  #tip .t2, #tip .t3 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .footer {
    flex: 0 0 auto; padding: 7px 20px;
    font-size: 11px; color: #66717c; text-align: center;
    background: rgba(11,16,22,.94);
    border-top: 1px solid rgba(255,255,255,.08);
  }
  .footer a { color: #8b98a5; text-decoration: none; }
  .footer a:hover { color: #0FDC78; }

  @media (max-width: 780px) {
    .search input { width: 120px; }
    .search input:focus { width: 150px; }
    .zoom { display: none; }
    .title { font-size: 14px; }
  }
</style>
</head>

<script src="data.js"></script>
<script>
(function () {
  const DATA = window.__COMMUNITY_PHOTO__ || { users: [] };
  const people = DATA.users.map(function (u, i) {

  const SRC_LABEL = { play1: '玩法一 · 盖楼帖', play2: '玩法二 · 作品秀', active: '社区活跃 Builder', hot: '热门帖参与者' };
  const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const zoomInput = document.getElementById('zoom');
  const modesBar = document.getElementById('modes');
  const btnShot = document.getElementById('btnShot');

  const globeCtx = globeCv.getContext('2d');
  const flowCv = document.getElementById('flow');
  const flowCtx = flowCv.getContext('2d');
  const flowBar = document.getElementById('flowBar');
  const flowText = document.getElementById('flowText');
  const flowGo = document.getElementById('flowGo');
  const flowBack = document.getElementById('flowBack');
  const flowImgBtn = document.getElementById('flowImgBtn');
  const flowFile = document.getElementById('flowFile');
  const flowGallery = document.getElementById('flowGallery');
  const flowNote = document.getElementById('flowNote');
  const flowLevelBtns = document.querySelectorAll('#flowBar .fbLevel button');
  const flowLvInfo = document.getElementById('flowLvInfo');
  const fxCv = document.getElementById('fx');
  const fxCtx = fxCv.getContext('2d');
  const linkAll = document.getElementById('linksAll');
  const linkHot = document.getElementById('linksHot');
  const heroCard = document.getElementById('heroCard');
  const heroBtn = document.getElementById('heroBtn');
  const heroExit = document.getElementById('heroExit');
  const prRange = document.getElementById('prRange');
  const prInfo = document.getElementById('prInfo');
  const prMarks = document.querySelectorAll('#heroCard .prMarks span');

  const MODE_NAME = { countdown: '倒计时', constellation: '星座', globe: '地球', flow: '星流', pixel: '1024' };
  const TOP_BAND = 140;
  let mode = 'countdown';
  let stageW = 0, stageH = 0, fitScale = 1, userZoom = 1, lastSz = 40;
  let personLinks = [], edgesD = '';

  countEl.textContent = people.length;
  bannerSub.textContent = '2026.10.24 · 共 ' + people.length + ' 位 Builder · 致敬每一个正在 Build 的人';

  /* ================= DOM ================= */
  const frag = document.createDocumentFragment();
  people.forEach(function (p) {
    const el = document.createElement('div');
    el.className = 'p';
    const av = document.createElement('div');
    av.className = 'avatar';

    img.src = p.a; img.alt = p.n; img.loading = 'eager'; img.decoding = 'async';
    av.appendChild(img);
    const nm = document.createElement('div');
    nm.className = 'nm';
    nm.textContent = p.n;
    el.appendChild(av); el.appendChild(nm);
    el.dataset.idx = p.index;
    p.el = el; p.img = img; p.avEl = av;
    frag.appendChild(el);
  });
  stage.appendChild(frag);

  /* ================= 伪随机 ================= */
  function hash(i, salt) {
    let h = (i * 2654435761 + salt * 40503) >>> 0;
    h ^= h >>> 15; h = (h * 2246822519) >>> 0;
    h ^= h >>> 13; h = (h * 3266489917) >>> 0;
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  function angDelta(from, to) {
    let d = (to - from) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return d;
  }

  /* ================= 背景：星空 / 行星 / 球体 ================= */
  function drawBackdrop(ctx, W, H, o) {
    o = o || {};
    const base = ctx.createLinearGradient(0, 0, 0, H);
    base.addColorStop(0, '#101a29');
    base.addColorStop(0.55, '#090d16');
    base.addColorStop(1, '#05080e');
    ctx.fillStyle = base;
    ctx.fillRect(0, 0, W, H);

    const glow = function (x, y, r, color) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, color);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    };
    glow(W * 0.18, H * 0.03, W * 0.55, 'rgba(15,220,120,.15)');
    glow(W * 0.84, H * 0.07, W * 0.50, 'rgba(128,193,255,.12)');
    glow(W * 0.50, H * 0.50, W * 0.70, 'rgba(70,110,220,.07)');

    // 星野
    const starCount = Math.round((W * H) / 4200);
    for (let i = 0; i < starCount; i++) {
      const x = hash(i, 11) * W;
      const y = hash(i, 12) * H * 0.94;
      const r = 0.4 + hash(i, 13) * 1.7;
      const a = 0.14 + hash(i, 14) * 0.66;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
      ctx.fill();
      if (r > 1.5 && hash(i, 15) > 0.72) {
        ctx.strokeStyle = 'rgba(255,255,255,' + (a * 0.45).toFixed(3) + ')';
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(x - r * 4.5, y); ctx.lineTo(x + r * 4.5, y);
        ctx.moveTo(x, y - r * 4.5); ctx.lineTo(x, y + r * 4.5);
        ctx.stroke();
      }
    }

    if (o.sphere) {
      const cx = o.sphere.cx, cy = o.sphere.cy, R = o.sphere.R;
      // 大气
      const atm = ctx.createRadialGradient(cx, cy, R * 0.88, cx, cy, R * 1.10);
      atm.addColorStop(0, 'rgba(15,220,120,0)');
      atm.addColorStop(0.5, 'rgba(15,220,120,.22)');
      atm.addColorStop(1, 'rgba(15,220,120,0)');
      ctx.fillStyle = atm;
      ctx.beginPath(); ctx.arc(cx, cy, R * 1.10, 0, Math.PI * 2); ctx.fill();
      // 球体
      const body = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.35, R * 0.1, cx, cy, R);
      body.addColorStop(0, '#16323f');
      body.addColorStop(0.55, '#0b1b2a');
      body.addColorStop(1, '#04070d');
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.fillStyle = body; ctx.fill();
      // 边缘光
      ctx.beginPath(); ctx.arc(cx, cy, R - 1, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(15,220,120,.34)';
      ctx.lineWidth = 1.5; ctx.stroke();
      return;
    }

    const apex = o.apexY != null ? o.apexY : H + W;
    if (apex > H + 40) return;   // 不需要行星

    const R = W * 0.94;
    const cy = apex + R;
    const atm = ctx.createRadialGradient(W / 2, cy, R * 0.9, W / 2, cy, R * 1.08);
    atm.addColorStop(0, 'rgba(15,220,120,0)');
    atm.addColorStop(0.55, 'rgba(15,220,120,.20)');
    atm.addColorStop(1, 'rgba(15,220,120,0)');
    ctx.fillStyle = atm;
    ctx.beginPath(); ctx.arc(W / 2, cy, R * 1.08, 0, Math.PI * 2); ctx.fill();

    const body = ctx.createLinearGradient(0, apex, 0, H + R * 0.2);
    body.addColorStop(0, '#123647');
    body.addColorStop(0.35, '#0d2334');
    body.addColorStop(1, '#050912');
    ctx.beginPath(); ctx.arc(W / 2, cy, R, 0, Math.PI * 2);
    ctx.fillStyle = body; ctx.fill();

    ctx.save();
    ctx.beginPath(); ctx.arc(W / 2, cy, R, 0, Math.PI * 2); ctx.clip();
    ctx.strokeStyle = 'rgba(15,220,120,.13)';
    ctx.lineWidth = 1;
    for (let k = 1; k <= 5; k++) {
      const d = (H - apex) * (k / 6) * 1.7;
      if (d >= R) break;
      const half = Math.sqrt(Math.max(0, R * R - (R - d) * (R - d)));
      ctx.beginPath();
      ctx.ellipse(W / 2, apex + d, half, Math.max(5, half * 0.15), 0, Math.PI, Math.PI * 2);
      ctx.stroke();
    }
    for (let k = -2; k <= 2; k++) {
      ctx.beginPath();
      ctx.ellipse(W / 2 + k * R * 0.17, cy, Math.max(6, R * 0.09), R, 0, Math.PI, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();

    ctx.beginPath(); ctx.arc(W / 2, cy, R - 1.5, Math.PI, Math.PI * 2);
    ctx.strokeStyle = 'rgba(15,220,120,.5)';
    ctx.lineWidth = 2.5; ctx.stroke();
  }

  // 背景缓存：尺寸/构图（apexY、球体几何）/dpr 任一变化才重绘，
  // 其余情况（同尺寸切 tab、resize 回到同宽等）直接复用现有画布像素
  let bgPaintKey = '';
  function paintBackdrop(W, H, o) {
    o = o || {};
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const key = W + 'x' + H + '@' + dpr + '|' + (o.apexY != null ? Math.round(o.apexY) : '') + '|' +
                (o.sphere ? o.sphere.cx.toFixed(1) + ',' + o.sphere.cy.toFixed(1) + ',' + o.sphere.R.toFixed(1) : '');
    if (key === bgPaintKey && bgCanvas.width) return;   // 没变：跳过整幅 3 层径向渐变 + 数百星点的重绘
    bgPaintKey = key;
    bgCanvas.width = Math.max(1, Math.round(W * dpr));
    bgCanvas.height = Math.max(1, Math.round(H * dpr));
    bgCanvas.style.width = W + 'px';
    bgCanvas.style.height = H + 'px';
    const ctx = bgCanvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawBackdrop(ctx, W, H, o);
  }

  /* ================= 闪烁星与流星 ================= */
  function createStars() {
    const f = document.createDocumentFragment();
    for (let i = 0; i < 44; i++) {
      const d = document.createElement('div');
      d.className = 'starDot';
      d.style.left = (hash(i, 21) * 100).toFixed(2) + '%';
      d.style.top = (hash(i, 22) * 62).toFixed(2) + '%';
      const s = 1.5 + hash(i, 23) * 2.6;
      d.style.width = s.toFixed(1) + 'px';
      d.style.height = s.toFixed(1) + 'px';
      d.style.setProperty('--o', (0.18 + hash(i, 24) * 0.5).toFixed(2));
      d.style.setProperty('--dur', (3 + hash(i, 25) * 4).toFixed(1) + 's');
      d.style.setProperty('--delay', (hash(i, 26) * 5).toFixed(1) + 's');
      f.appendChild(d);
    }
    for (let i = 0; i < 2; i++) {
      const s = document.createElement('div');
      s.className = 'shooting';
      s.style.left = (6 + i * 42) + '%';
      s.style.top = (5 + i * 14) + '%';
      s.style.setProperty('--dur', (11 + i * 7) + 's');
      s.style.setProperty('--delay', (i * 4).toFixed(1) + 's');
      f.appendChild(s);
    }
    stage.appendChild(f);
  }

  /* ================= 版式一：星座 ================= */
  function layoutConstellation() {
    const n = people.length;
    const W = Math.max(720, viewport.clientWidth - 44);
    const H = Math.round(W * 0.66);
    const sz = Math.max(12, Math.min(18, Math.round(W / 100)));
    lastSz = sz;

    const k = Math.max(6, Math.min(18, Math.round(n / 42)));
    const cols = Math.max(1, Math.ceil(Math.sqrt(k * (W / H))));
    const rowsC = Math.max(1, Math.ceil(k / cols));
    const PAD = 78;
    const centers = [];
    for (let r = 0; r < rowsC && centers.length < k; r++) {
      for (let c = 0; c < cols && centers.length < k; c++) {
        const idx = centers.length;
        centers.push({
          x: PAD + (W - PAD * 2) * ((c + 0.5) / cols) + (hash(idx, 31) - 0.5) * (W / cols) * 0.42,
          y: (TOP_BAND + 8) + (H - TOP_BAND - 92) * ((r + 0.5) / rowsC) + (hash(idx, 32) - 0.5) * (H / rowsC) * 0.42
        });
      }
    }

    const perCluster = Math.ceil(n / centers.length);
    const spread = Math.min(H / rowsC, W / cols) * 0.46;

    for (let i = 0; i < n; i++) {
      const ci = i % centers.length;
      const c = centers[ci];
      const t = (Math.floor(i / centers.length) + 0.5) / perCluster;
      const ang = t * Math.PI * 4.6 + hash(i, 33) * 1.6;
      const rad = spread * Math.sqrt(t) * (0.42 + hash(i, 34) * 0.9);
      const p = people[i];
      p.cluster = ci;
      p.sph = null;
      p.x = Math.min(W - 26, Math.max(26, c.x + Math.cos(ang) * rad));
      p.y = Math.min(H - 46, Math.max(TOP_BAND + 34, c.y + Math.sin(ang) * rad * 0.86));
      p.rot = (hash(i, 3) - 0.5) * 14;
    }

    return { W: W, H: H, sz: sz, showNames: false, apexY: H - 40, sphere: null };
  }

  /* ================= 版式二：地球 ================= */
  let globe = { rotY: 0.5, rotX: 0.32, target: null, R: 300, cx: 0, cy: 0, sz: 26 };
  let globeAuto = !REDUCED, globeRaf = null, globeLast = 0, globeHover = false, dragging = false;

  function fibonacciSphere(n) {
    const pts = [], ga = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < n; i++) {
      const y = 1 - (i + 0.5) * 2 / n;
      const r = Math.sqrt(Math.max(0, 1 - y * y));
      const th = ga * i;
      pts.push({ x: Math.cos(th) * r, y: y, z: Math.sin(th) * r });
    }
    return pts;
  }

  function layoutGlobe() {
    const W = Math.max(900, viewport.clientWidth - 44);
    const H = Math.round(W * 0.60);
    const R = Math.min(W * 0.44, H * 0.42);
    const sz = Math.max(12, Math.min(32, Math.round(R * 0.076)));
    lastSz = sz;

    if (!people[0] || !people[0].sph) {
      const pts = fibonacciSphere(people.length);
      people.forEach(function (p, i) {
        p.sph = pts[i];
        p.cluster = null;
      });
    }

    globe.R = R;
    globe.cx = W / 2;
    globe.cy = H / 2 + 16;
    globe.sz = sz;

    return { W: W, H: H, sz: sz, showNames: false, sphere: { cx: globe.cx, cy: globe.cy, R: R } };
  }

  let discs = [];            // 下标 = p.index，头像离屏烘焙结果
  let globeSorted = [];
  let hitSet = new Set();
  let dprEff = 0;

  function currentDpr() {
    const z = fitScale * userZoom;
    return Math.min(2, (window.devicePixelRatio || 1) * z);
  }

  // canvas 尺寸只在 apply / zoom 变化时改（每帧改 width 会清屏并重分配）
  function resizeGlobeCanvas() {
    dprEff = currentDpr();
    globeCv.width = Math.max(1, Math.round(stageW * dprEff));
    globeCv.height = Math.max(1, Math.round(stageH * dprEff));
    globeCv.style.width = stageW + 'px';
    globeCv.style.height = stageH + 'px';
  }

  // 抽出投影数学（实时绘制与导出共用，避免所见 ≠ 所得）
  function projectGlobe() {
    const cosY = Math.cos(globe.rotY), sinY = Math.sin(globe.rotY);
    const cosX = Math.cos(globe.rotX), sinX = Math.sin(globe.rotX);
    const R = globe.R, sz = globe.sz;
    const list = [];
    for (let i = 0; i < people.length; i++) {
      const s = people[i].sph;
      const p = people[i];
      const x1 = s.x * cosY + s.z * sinY;
      const z1 = -s.x * sinY + s.z * cosY;
      const y2 = s.y * cosX - z1 * sinX;
      const z2 = s.y * sinX + z1 * cosX;
      p.rd = z2;
      p.rx = globe.cx + x1 * R;
      p.ry = globe.cy + y2 * R;
      p.rk = 0.52 + 0.48 * ((z2 + 1) / 2);
      p.rop = z2 <= -0.04 ? 0 : Math.min(1, (z2 + 0.04) / 0.38) * 0.9 + 0.1;
      p.rot = 0;
      p.rs = sz * p.rk;
      list.push(p);
    }
    list.sort(function (a, b) { return a.rd - b.rd; });
    return list;
  }

  // 96px 离屏烘焙：圆形裁切 + 白环，只做一次
  function makeDisc(src) {
    const S = 96, r = S / 2;
    const cv = document.createElement('canvas');
    cv.width = S; cv.height = S;
    const c = cv.getContext('2d');
    c.save();
    c.beginPath(); c.arc(r, r, r - 2.5, 0, Math.PI * 2); c.closePath(); c.clip();
    try { c.drawImage(src, 0, 0, S, S); } catch (e) {}
    c.restore();
    c.beginPath(); c.arc(r, r, r - 1.4, 0, Math.PI * 2);
    c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 2.6; c.stroke();
    return cv;
  }

  // 实时绘制与导出共用的头像绘制
  function drawDisc(ctx, p, size, alpha) {
    const half = size / 2;
    const d = discs[p.index];
    ctx.globalAlpha = alpha;
    if (d && d.disc) {
      ctx.drawImage(d.disc, p.rx - half, p.ry - half, size, size);
    } else if (d && d.bmp) {
      ctx.drawImage(d.bmp, p.rx - half, p.ry - half, size, size);
    } else if (p.img && p.img.complete && p.img.naturalWidth) {
      ctx.save();
      ctx.beginPath(); ctx.arc(p.rx, p.ry, half, 0, Math.PI * 2); ctx.closePath(); ctx.clip();
      try { ctx.drawImage(p.img, p.rx - half, p.ry - half, size, size); } catch (e) {}
      ctx.restore();
      ctx.beginPath(); ctx.arc(p.rx, p.ry, Math.max(0, half - 1), 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawGlobeFrame() {
    if (!globeCv.width) return;
    const ctx = globeCtx;
    ctx.setTransform(dprEff, 0, 0, dprEff, 0, 0);
    ctx.clearRect(0, 0, stageW, stageH);
    globeSorted = projectGlobe();
    for (let i = 0; i < globeSorted.length; i++) {
      const p = globeSorted[i];
      if (p.rop <= 0) continue;
      drawDisc(ctx, p, p.rs, p.rop);
    }
    if (hitSet.size) {
      const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 260);
      ctx.strokeStyle = 'rgba(15,220,120,' + (0.55 + 0.4 * pulse).toFixed(3) + ')';
      ctx.lineWidth = 2 + pulse * 1.6;
      for (let i = 0; i < globeSorted.length; i++) {
        const p = globeSorted[i];
        if (p.rop <= 0 || !hitSet.has(p.index)) continue;
        ctx.beginPath(); ctx.arc(p.rx, p.ry, p.rs / 2 + 3, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.lineWidth = 1;
    }
  }

  function renderGlobe() { drawGlobeFrame(); }

  // 分批 + idle 解码头像，避免首屏一次性解码 600 张卡顿
  function predecodeAvatars() {
    let i = 0;
    const BATCH = 24;
    const idle = window.requestIdleCallback
      ? function (cb) { requestIdleCallback(cb, { timeout: 220 }); }
      : function (cb) { setTimeout(cb, 14); };
    function bake(p, src) { try { discs[p.index] = { bmp: null, disc: makeDisc(src) }; } catch (e) {} }
    function step() {
      let n = 0;
      while (i < people.length && n < BATCH) {
        const p = people[i++]; n++;
        const img = p.img;
        const go = function () {
          if (window.createImageBitmap) {
            createImageBitmap(img).then(function (bmp) {
              discs[p.index] = { bmp: bmp, disc: makeDisc(bmp) };
            }).catch(function () { bake(p, img); });
          } else { bake(p, img); }
        };
        if (img.decode) {
          img.decode().then(go).catch(function () { if (img.complete && img.naturalWidth) go(); });
        } else if (img.complete && img.naturalWidth) { go(); }
      }
      if (i < people.length) idle(step);
    }
    idle(step);
  }

  // 统一命中检测入口：地球用投影后屏幕坐标圆形命中（反向遍历取最上层），DOM 用 closest('.p')
  function pickPerson(clientX, clientY) {
    if (mode === 'globe') {
      const rect = globeCv.getBoundingClientRect();
      const z = fitScale * userZoom || 1;
      const x = (clientX - rect.left) / z, y = (clientY - rect.top) / z;
      for (let i = globeSorted.length - 1; i >= 0; i--) {
        const p = globeSorted[i];
        if (p.rop <= 0) continue;
        const r = p.rs / 2 + 2;
        const dx = x - p.rx, dy = y - p.ry;
        if (dx * dx + dy * dy <= r * r) return p;
      }
      return null;
    }
    const el = document.elementFromPoint(clientX, clientY);
    const pel = el && el.closest ? el.closest('.p') : null;
    return pel ? people[+pel.dataset.idx] : null;
  }

  function showTip(p) {
    tip.querySelector('.t1').textContent = p.n;
    tip.querySelector('.t2').textContent = '@' + p.u + (p.p != null ? ' · ' + p.p + ' 帖' : '');
    tip.querySelector('.t3').textContent = p.t ? p.t : (SRC_LABEL[p.s] || '');
    tip.classList.add('on');
  }
  function hideTip() { tip.classList.remove('on'); }


  function globeTick(t) {
    globeRaf = requestAnimationFrame(globeTick);
    if (mode !== 'globe') return;
    if (t - globeLast < 15) return;
    const dt = globeLast ? Math.min(0.12, (t - globeLast) / 1000) : 0.03;
    globeLast = t;

    if (globe.target) {
      const k = Math.min(1, dt * 4.2);
      globe.rotY += (globe.target.y - globe.rotY) * k;
      globe.rotX += (globe.target.x - globe.rotX) * k;
      if (Math.abs(globe.target.y - globe.rotY) < 0.003 && Math.abs(globe.target.x - globe.rotX) < 0.003) {
        globe.rotY = globe.target.y; globe.rotX = globe.target.x; globe.target = null;
      }
    } else if (globeAuto && !dragging && !globeHover) {
      globe.rotY += dt * 0.14;
    }
    renderGlobe();
  }

  function startGlobe() {
    renderGlobe();
    if (!globeRaf) globeRaf = requestAnimationFrame(globeTick);
  }
  function stopGlobe() {
    if (globeRaf) { cancelAnimationFrame(globeRaf); globeRaf = null; }
    globeLast = 0;
  }

  function globeFocus(p) {
    if (!p.sph) return;
    const s = p.sph;
    const wantY = Math.atan2(-s.x, s.z);
    const wantX = Math.atan2(s.y, Math.hypot(s.x, s.z));
    globeAuto = false;
    globe.target = { y: globe.rotY + angDelta(globe.rotY, wantY), x: wantX };
    if (!globeRaf) globeRaf = requestAnimationFrame(globeTick);
  }

  /* ================= 版式三：1024 ================= */
  // 文字槽位缓存：键 = 文本|画布尺寸|人数。倒计时每秒换字、resize、切 tab 回来时，
  // 只要（文本、舞台尺寸）没变就直接复用，不再重做 fillText + getImageData + 18 轮占用扫描。
  const slotCache = new Map();
  function textSlots(text, W, H, count) {
    const key = text + '|' + W + 'x' + H + '|' + count;
    const hit = slotCache.get(key);
    if (hit) return hit;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d', { willReadFrequently: true });   // CPU 画布，避免 getImageData 多 MB GPU→CPU 回读
    let fs = Math.floor(H * 0.9);
    ctx.font = '900 ' + fs + 'px "Inter","PingFang SC",system-ui,sans-serif';
    let m = ctx.measureText(text);
    const k = Math.min((W * 0.86) / Math.max(1, m.width), (H * 0.62) / fs);
    fs = Math.max(40, Math.floor(fs * k));
    ctx.font = '900 ' + fs + 'px "Inter","PingFang SC",system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000';
    ctx.fillText(text, W / 2, H / 2 + fs * 0.03);
    // 只回读文字包围盒：全幅 getImageData（2000×1080 起）是最后一天每秒重排时的最大单笔开销，
    // 而笔画只占中间一块，盒外必是背景。老浏览器没有 actualBoundingBox 时退回全幅。
    const midY = H / 2 + fs * 0.03;
    const mm = ctx.measureText(text);
    let bx = 0, by = 0, bw = W, bh = H;
    if (mm.actualBoundingBoxLeft !== undefined) {
      const pad = 8;
      bx = Math.max(0, Math.floor(W / 2 - mm.actualBoundingBoxLeft - pad));
      by = Math.max(0, Math.floor(midY - mm.actualBoundingBoxAscent - pad));
      bw = Math.min(W - bx, Math.ceil(mm.actualBoundingBoxLeft + mm.actualBoundingBoxRight) + pad * 2);
      bh = Math.min(H - by, Math.ceil(mm.actualBoundingBoxAscent + mm.actualBoundingBoxDescent) + pad * 2);
      if (bw <= 0 || bh <= 0) { bx = 0; by = 0; bw = W; bh = H; }
    }
    const data = ctx.getImageData(bx, by, bw, bh).data;

    function occupied(c) {
      if (c < 6) c = 6;
      const cols = Math.floor(W / c), rows = Math.floor(H / c);
      const ox = (W - cols * c) / 2, oy = (H - rows * c) / 2;
      const out = [];
      for (let r = 0; r < rows; r++) {
        for (let col = 0; col < cols; col++) {
          const cx = Math.round(ox + (col + 0.5) * c);
          const cy = Math.round(oy + (r + 0.5) * c);
          const lx = cx - bx, ly = cy - by;
          if (lx < 0 || ly < 0 || lx >= bw || ly >= bh) continue;   // 包围盒外没有笔画
          if (data[(ly * bw + lx) * 4 + 3] > 128) out.push({ x: cx, y: cy, r: r, col: col });
        }
      }
      return out;
    }

    let best = null, lo = 8, hi = Math.max(60, Math.floor(W / 8));
    for (let it = 0; it < 18; it++) {
      const c = Math.round((lo + hi) / 2);
      const cells = occupied(c);
      if (cells.length >= count) { best = { c: c, cells: cells }; lo = c; }
      else hi = c;
      if (hi - lo <= 1) break;
    }
    if (!best) best = { c: 14, cells: occupied(14) };

    const all = best.cells.sort(function (a, b) { return a.r - b.r || a.col - b.col; });
    let picked;
    if (all.length <= count) picked = all;
    else {
      picked = [];
      const step = all.length / count;
      for (let i = 0; i < count; i++) picked.push(all[Math.floor(i * step)]);
    }
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    picked.forEach(function (c) {
      minX = Math.min(minX, c.x); maxX = Math.max(maxX, c.x);
      minY = Math.min(minY, c.y); maxY = Math.max(maxY, c.y);
    });
    const offX = (W - (minX + maxX)) / 2, offY = (H - (minY + maxY)) / 2;
    const res = { cell: best.c, slots: picked.map(function (c) { return { x: c.x + offX, y: c.y + offY }; }) };
    if (slotCache.size > 24) slotCache.delete(slotCache.keys().next().value);   // 有界：只留最近 24 条
    slotCache.set(key, res);
    return res;
  }

  function layoutPixel() {
    const W = Math.max(viewport.clientWidth - 44, 2000);
    const H = Math.round(W * 0.54);
    const res = textSlots('1024', W, H, people.length);
    const sz = Math.max(12, Math.round(res.cell * 0.94));
    lastSz = sz;
    people.forEach(function (p, i) {
      const s = res.slots[i] || { x: W / 2, y: H / 2 };
      p.x = s.x; p.y = s.y; p.rot = (hash(i, 7) - 0.5) * 3;
      p.sph = null; p.cluster = null;
    });
    return { W: W, H: H, sz: sz, showNames: false, apexY: Math.round(H * 0.86), sphere: null };
  }

  /* ================= 版式四：倒计时点阵 ================= */
  // 显示策略：>1 天只到「分」（`3天13时26分`，位数少、一眼读完）；
  //           最后 1 天内补上秒（`13时26分47秒`），保留归零前的紧迫感；
  //           最后 1 小时内去掉「00时」（`26分47秒`），头像可以更大。
  // 不插空格：单位字（天/时/分）本身就是天然分隔，省下宽度能让头像更大更清晰。
  function formatCountdown(left) {
    const total = Math.max(0, Math.floor(left / 1000));
    const d = Math.floor(total / 86400);
    const h = Math.floor((total % 86400) / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    if (d > 0) return d + '天' + pad2(h) + '时' + pad2(m) + '分';
    if (h > 0) return pad2(h) + '时' + pad2(m) + '分' + pad2(s) + '秒';
    return pad2(m) + '分' + pad2(s) + '秒';
  }

  function layoutCountdown() {
    const W = Math.max(viewport.clientWidth - 44, 2000);
    const H = Math.round(W * 0.54);
    // 1024 当天这个 tab 叫「主角秀」，没有剩余时间可显示；只在主角秀还没起场的空档铺一个「1024」撑着
    const txt = on1024Day() ? '1024' : formatCountdown(CD_TARGET - Date.now());
    const res = textSlots(txt, W, H, people.length);
    const sz = Math.max(12, Math.round(res.cell * 0.94));
    lastSz = sz;
    people.forEach(function (p, i) {
      const s = res.slots[i] || { x: W / 2, y: H / 2 };
      p.x = s.x; p.y = s.y; p.rot = (hash(i, 7) - 0.5) * 3;
      p.sph = null; p.cluster = null;
    });
    return { W: W, H: H, sz: sz, showNames: false, apexY: Math.round(H * 0.86), sphere: null };
  }
