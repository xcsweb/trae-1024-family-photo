  /* --------- 把主角卡片画进导出图：和屏幕上那张卡同一份数据、同一套布局 --------- */
  function roundRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function fitText(ctx, txt, maxW) {
    if (ctx.measureText(txt).width <= maxW) return txt;
    let s = txt;
    while (s.length > 1 && ctx.measureText(s + '…').width > maxW) s = s.slice(0, -1);
    return s + '…';
  }

  function drawHeroCard(ctx, g) {
    const p = people[heroPerson];
    if (!p || !g) return;
    const m = heroCardModel(p);

    const F_NM = '700 26px "PingFang SC",system-ui,sans-serif';
    const F_US = '400 15px "PingFang SC",system-ui,sans-serif';
    const F_BD = '400 13px "PingFang SC",system-ui,sans-serif';
    const F_TI = '400 15px "PingFang SC",system-ui,sans-serif';
    const F_LI = '400 16px "PingFang SC",system-ui,sans-serif';
    const F_MT = '400 13px "PingFang SC",system-ui,sans-serif';

    const padX = 22, padT = 22, padB = 16, gapTop = 16;
    const cardW = g.cardW, innerW = cardW - padX * 2;
    const avD = 82, avR = avD / 2;

    // 徽章先折行，量出上部高度
    ctx.font = F_BD;
    const rows = [];
    let row = [], rowW = 0;
    const rowMax = innerW - avD - gapTop;
    m.badges.forEach(function (b) {
      const bw = ctx.measureText(b.txt).width + 22;
      if (row.length && rowW + 6 + bw > rowMax) { rows.push({ items: row, w: rowW }); row = []; rowW = 0; }
      if (row.length) rowW += 6;
      row.push({ txt: b.txt, plain: b.plain, w: bw });
      rowW += bw;
    });
    if (row.length) rows.push({ items: row, w: rowW });
    const badgeH = rows.length ? rows.length * 28 : 0;
    const idH = 34 + 3 + 21 + (badgeH ? 8 + badgeH : 0);
    const topH = Math.max(avD, idH);

    let h = padT + topH + 18 + 14 + 21 + 10 + m.items.length * 33 + padB;

    const x0 = g.cardX, y0 = g.gridY + g.gridH * 0.06;

    roundRectPath(ctx, x0, y0, cardW, h, 16);
    const grad = ctx.createLinearGradient(0, y0, 0, y0 + h);
    grad.addColorStop(0, 'rgba(13,20,28,.95)');
    grad.addColorStop(1, 'rgba(9,14,20,.95)');
    ctx.fillStyle = grad; ctx.fill();
    roundRectPath(ctx, x0 + .5, y0 + .5, cardW - 1, h - 1, 16);
    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(15,220,120,.34)'; ctx.stroke();

    // 头像（圆形裁切 + 绿边）
    const ax = x0 + padX, ay = y0 + padT + (topH - avD) / 2;
    ctx.save();
    ctx.beginPath(); ctx.arc(ax + avR, ay + avR, avR, 0, Math.PI * 2); ctx.clip();
    const img = p.img;
    if (img && img.naturalWidth) {
      const s = Math.min(img.naturalWidth, img.naturalHeight);
      ctx.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, ax, ay, avD, avD);
    } else { ctx.fillStyle = '#16202c'; ctx.fillRect(ax, ay, avD, avD); }
    ctx.restore();
    ctx.beginPath(); ctx.arc(ax + avR, ay + avR, avR + 1.5, 0, Math.PI * 2);
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(15,220,120,.85)'; ctx.stroke();

    // 昵称 / @用户名 / 徽章
    const tx = ax + avD + gapTop, txMax = cardW - padX * 2 - avD - gapTop;
    let ty = y0 + padT + (topH - idH) / 2;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#eafff4'; ctx.font = F_NM;
    ctx.fillText(fitText(ctx, m.name, txMax), tx, ty + 26);
    ty += 34 + 3;
    ctx.fillStyle = '#7f8c99'; ctx.font = F_US;
    ctx.fillText(fitText(ctx, m.user, txMax), tx, ty + 15);
    ty += 21 + 8;
    rows.forEach(function (r) {
      let bx = tx;
      r.items.forEach(function (b) {
        roundRectPath(ctx, bx, ty, b.w, 22, 11);
        ctx.fillStyle = b.plain ? 'rgba(255,255,255,.06)' : 'rgba(15,220,120,.12)'; ctx.fill();
        ctx.lineWidth = 1; ctx.strokeStyle = b.plain ? 'rgba(255,255,255,.16)' : 'rgba(15,220,120,.40)'; ctx.stroke();
        ctx.fillStyle = b.plain ? '#9fb0bf' : '#0FDC78'; ctx.font = F_BD;
        ctx.textBaseline = 'middle';
        ctx.fillText(b.txt, bx + 11, ty + 11);
        bx += b.w + 6;
      });
      ty += 28;
    });
    ctx.textBaseline = 'alphabetic';

    // 分隔线 + 「TA 做了什么」
    const didY = y0 + padT + topH + 18;
    ctx.fillStyle = 'rgba(255,255,255,.10)';
    ctx.fillRect(x0 + padX, didY, innerW, 1);
    ctx.fillStyle = '#0FDC78'; ctx.font = F_TI;
    ctx.fillText('TA 做了什么', x0 + padX, didY + 14 + 15);

    // 帖子列表
    let ly = didY + 14 + 21 + 10;
    m.items.forEach(function (it) {
      ctx.fillStyle = '#0FDC78'; ctx.font = F_LI;
      ctx.fillText('•', x0 + padX, ly + 17);
      ctx.font = F_MT;
      const mw = it.meta ? ctx.measureText(it.meta).width : 0;
      ctx.fillStyle = '#c8d4e0'; ctx.font = F_LI;
      ctx.fillText(fitText(ctx, it.text, innerW - 8 - (mw ? mw + 8 : 0)), x0 + padX + 8, ly + 17);
      if (mw) {
        ctx.fillStyle = '#7f8c99'; ctx.font = F_MT; ctx.textAlign = 'right';
        ctx.fillText(it.meta, x0 + padX + innerW, ly + 17);
        ctx.textAlign = 'left';
      }
      ly += 33;
    });
  }

  async function exportPNG() {
    const S = 2, W = stageW, H = stageH;
    const cv = document.createElement('canvas');
    cv.width = Math.round(W * S);
    cv.height = Math.round(H * S);
    const ctx = cv.getContext('2d');
    ctx.scale(S, S);

    const heroExport = mode === 'countdown' && heroOn;
    let heroTileExport = false;
    const flowExport = mode === 'flow';
    const L = flowExport ? { apexY: Math.round(H * 0.96), sphere: null }
            : mode === 'constellation' ? layoutConstellation()
            : (mode === 'globe' || heroExport) ? null
            : mode === 'countdown' ? layoutCountdown()
            : layoutPixel();

    if (flowExport) {
      // 星流画面没有行星背景，导出沿用同一套暗色渐变，保证和屏幕上看到的一致
      const base = ctx.createLinearGradient(0, 0, 0, H);
      base.addColorStop(0, '#0b1220');
      base.addColorStop(0.55, '#080c14');
      base.addColorStop(1, '#05080e');
      ctx.fillStyle = base; ctx.fillRect(0, 0, W, H);
    } else {
      drawBackdrop(ctx, W, H, mode === 'globe'
        ? { sphere: { cx: globe.cx, cy: globe.cy, R: globe.R } }
        : { apexY: heroExport ? H - 40 : L.apexY });
    }

    if (mode === 'globe') {
      // 与实时同源的投影（保持当前旋转角）
      projectGlobe();
    } else if (heroExport) {
      heroFrame();                       // 与屏幕同源的坐标：名字阶段导出名字，头像阶段导出马赛克
      if (heroPhase === 'mosaic' && heroWho) {
        heroTileExport = true;           // 像素画阶段直接按格画方块，和屏幕上一一对齐
      } else {
        people.forEach(function (p) { p.rk = 1; p.rd = 0; p.rop = p.x < -100 ? 0 : 1; });
      }
    } else if (!flowExport) {
      // 星流不重排：直接沿用当前帧的 p.x/p.y/p.rs/p.rot/p.rop（所见即所得）
      people.forEach(function (p) {
        p.rx = p.x; p.ry = p.y; p.rk = 1; p.rop = 1; p.rd = 0; p.rs = L.sz;
      });
    }
    // 标题
    const modeLabel = heroExport ? ('主角 · ' + people[heroPerson].n) : MODE_NAME[mode];
    ctx.textAlign = 'center';
    ctx.fillStyle = '#eafff4';
    ctx.font = '700 ' + Math.max(20, Math.round(W * 0.019)) + 'px "PingFang SC",system-ui,sans-serif';
    ctx.fillText('TRAE 社区 · 1024 全家福 · ' + modeLabel, W / 2, 52);
    ctx.fillStyle = '#8b98a5';
    ctx.font = '400 ' + Math.max(11, Math.round(W * 0.0095)) + 'px "PingFang SC",system-ui,sans-serif';
    ctx.fillText('2026.10.24 · 共 ' + people.length + ' 位 Builder · 致敬每一个正在 Build 的人', W / 2, 76);

    // 连线：复用实时构建的整段 d
    if (mode === 'constellation' && edgesD) {
      ctx.strokeStyle = 'rgba(15,220,120,.22)';
      ctx.lineWidth = 1;
      try { ctx.stroke(new Path2D(edgesD)); } catch (e) {}
    }

    await Promise.all(people.map(function (p) {
      return (p.img.decode ? p.img.decode() : Promise.resolve()).catch(function () {});
    }));

    if (flowExport) {
      if (flowSquare && flowGrid && flowWho) {
        // 收束态：按 flowWho 逐格绘制（含 >600 的附加节点格），与屏幕上的格网一致
        const g = flowGrid, sz = flowSz, half = sz / 2;
        for (let c = 0; c < flowWho.length; c++) {
          const pi = flowWho[c];
          if (pi < 0) continue;
          const img = people[pi] && people[pi].img;
          if (!img || !img.naturalWidth) continue;
          const x = g.ox + (c % g.cols + 0.5) * g.cell;
          const y = g.oy + (Math.floor(c / g.cols) + 0.5) * g.cell;
          const s = Math.min(img.naturalWidth, img.naturalHeight);
          const col = flowSlotColor
            ? 'rgb(' + (flowSlotColor[c * 3] | 0) + ',' + (flowSlotColor[c * 3 + 1] | 0) + ',' + (flowSlotColor[c * 3 + 2] | 0) + ')'
            : 'rgb(' + (domCol[pi * 3] | 0) + ',' + (domCol[pi * 3 + 1] | 0) + ',' + (domCol[pi * 3 + 2] | 0) + ')';
          // 与屏幕一致：目标色铺底 + soft-light 头像纹理
          ctx.save();
          ctx.fillStyle = col;
          ctx.fillRect(x - half, y - half, sz, sz);
          ctx.globalCompositeOperation = 'soft-light';
          ctx.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s,
                        x - half, y - half, sz, sz);
          ctx.restore();
        }
      } else {
        // 自由流动 / 文字收束：按当前帧的 p.x/p.y/p.rs/p.rot/p.rop 直接绘制
        people.forEach(function (p) {
          const img = p.img;
          if (!img || !img.naturalWidth || p.rop <= 0.01) return;
          const half = p.rs / 2;
          ctx.save();
          ctx.globalAlpha = Math.min(1, p.rop);
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot * Math.PI / 180);
          const s = Math.min(img.naturalWidth, img.naturalHeight);
          if (flowSquare) {
            ctx.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s,
                          -half, -half, p.rs, p.rs);
          } else {
            ctx.beginPath(); ctx.arc(0, 0, half, 0, Math.PI * 2); ctx.clip();
            ctx.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s,
                          -half, -half, p.rs, p.rs);
          }
          ctx.restore();
        });
      }
      // 收束状态：在画布角落画出当前作品署名
      if (flowPreset) {
        const sign = flowPreset.author + '《' + flowPreset.name + '》' +
                     (flowPreset.year ? flowPreset.year : '') + ' · ' + flowPreset.license;
        ctx.textAlign = 'right';
        ctx.fillStyle = 'rgba(185,198,211,.85)';
        ctx.font = '400 ' + Math.max(11, Math.round(W * 0.0095)) + 'px "PingFang SC",system-ui,sans-serif';
        ctx.fillText(sign, W - 28, H - 24);
      } else if (flowState === 'text') {
        ctx.textAlign = 'right';
        ctx.fillStyle = 'rgba(185,198,211,.85)';
        ctx.font = '400 ' + Math.max(11, Math.round(W * 0.0095)) + 'px "PingFang SC",system-ui,sans-serif';
        ctx.fillText('星流 · 文字「' + (flowText.value || '').slice(0, 12) + '」', W - 28, H - 24);
      }
    } else if (heroTileExport) {
      // 像素画：按格直接画方块，和屏幕上那块砖一一对应
      const g = heroGeomCache;
      for (let c = 0; c < H_N; c++) {
        const p = people[heroWho[c]];
        const img = p && p.img;
        if (!img || !img.naturalWidth) continue;
        const x = g.gridX + (c % H_COLS) * g.cell;
        const y = g.gridY + Math.floor(c / H_COLS) * g.cell;
        const s = Math.min(img.naturalWidth, img.naturalHeight);
        ctx.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s,
                      x + 0.5, y + 0.5, g.cell - 1, g.cell - 1);
      }
    } else {
      const order = people.slice().sort(function (a, b) { return a.rd - b.rd; });
      order.forEach(function (p) {
        if (p.rop <= 0) return;
        drawDisc(ctx, p, p.rs, p.rop);
      });
    }

    // 主角秀导出：把旁边那块信息窗一起画进去（和屏幕上那张卡内容一致）
    if (heroExport) drawHeroCard(ctx, heroGeomCache);

    const blob = await new Promise(function (res) { cv.toBlob(res, 'image/png'); });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'TRAE社区1024全家福-' + (heroExport ? '主角-' + people[heroPerson].n : MODE_NAME[mode]) + '.png';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  /* ================= 倒计时 / 纪念态 / 庆祝 ================= */
  // 目标：最近一个「还没走完的 1024」——当年 10-24 00:00 起 24 小时内算当天；
  // 当天走完自动滚到明年，倒计时永远不停在 0，明年 1024 也照样能用。
  function calcTarget(now) {
    const y = new Date(now).getUTCFullYear();
    let t = Date.UTC(y, 9, 23, 16, 0, 0);          // 等价当年 10-24 00:00 +08:00
    if (now >= t + 86400000) t = Date.UTC(y + 1, 9, 23, 16, 0, 0);
    return t;
  }
  let CD_TARGET = calcTarget(Date.now());
  let CD_END = CD_TARGET + 86400000;               // 1024 当天 24:00
  const cdBtn = modesBar.querySelector('button[data-mode="countdown"]');
  let cdTimer = null, cdRoll = null, cdLastStr = '', celebrated = false, fxRaf = null;

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  function cdTick() {
    const left = CD_TARGET - Date.now();
    if (left <= 0) { enterMemorial(); return; }
    const str = formatCountdown(left);
    if (str === cdLastStr) return;          // 秒未变则本帧不重排
    cdLastStr = str;
    if (mode === 'countdown' && !heroOn) countdownFrame();
  }

  function initCountdown() {
    if (Date.now() >= CD_TARGET) { enterMemorial(); return; }
    cdLastStr = formatCountdown(CD_TARGET - Date.now());
    cdTimer = setInterval(cdTick, 250);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && cdTimer) cdTick();
    });
  }

  // 1024 当天：倒计时板让位给「主角秀」——tab 不收起、只改名，
  // 主角秀照常玩（搜自己、拼名字、拼脸）；过了当天再换回倒计时，指向下一个 10-24。
  function enterMemorial() {
    if (cdTimer) { clearInterval(cdTimer); cdTimer = null; }
    clearTimeout(heroWheel);
    clearTimeout(heroPhaseT);
    if (heroOn) { heroOn = false; heroHideExtras(); }
    document.body.classList.add('memorial');
    if (cdBtn) { cdBtn.textContent = '主角秀'; cdBtn.style.display = ''; }
    if (mode === 'countdown') setMode('pixel', false);   // 归零瞬间落到 1024 点阵
    if (!celebrated) { celebrated = true; runCelebration(); }
    scheduleRollover();                                   // 排定当晚 24:00 回落
  }

  // 1024 当天走完：倒计时 tab 换回原样，目标滚到明年
  function scheduleRollover() {
    clearTimeout(cdRoll);
    const ms = CD_END - Date.now();
    // setTimeout 最多只能等约 24.8 天，隔一段时间复查更稳
    cdRoll = setTimeout(ms <= 0 ? rollover : function () {
      if (Date.now() >= CD_END) rollover(); else scheduleRollover();
    }, ms <= 0 ? 0 : Math.min(ms + 800, 6 * 3600 * 1000));
  }

  function rollover() {
    document.body.classList.remove('memorial');
    if (cdBtn) { cdBtn.textContent = '倒计时'; cdBtn.style.display = ''; }
    stopFx();
    CD_TARGET = calcTarget(Date.now());
    CD_END = CD_TARGET + 86400000;
    heroLocked = false;
    heroSearchIdx = -1;
    celebrated = false;
    cdLastStr = '';
    if (cdTimer) { clearInterval(cdTimer); cdTimer = null; }
    cdLastStr = formatCountdown(CD_TARGET - Date.now());
    cdTimer = setInterval(cdTick, 250);
    if (mode === 'countdown') carouselKick();             // 倒计时 tab 里恢复轮播
    scheduleRollover();                                   // 明年当天再走一遍
  }

  function runCelebration() {
    document.body.classList.add('lit');
    people.forEach(function (p, i) {
      p.el.style.setProperty('--lit-delay', Math.round(hash(i, 51) * 900) + 'ms');
    });
    if (!REDUCED) startFireworks(on1024Day());   // 1024 当天一直放，其余时间只放一轮
    setTimeout(function () { document.body.classList.remove('lit'); }, 2600);
  }

  /* ================= 烟花：升空 + 爆裂 + 拖尾 =================
     1024 当天（归零起算的这 24 小时）一直放；其余时间只在归零瞬间放一轮。 */
  const FX_HUES = [150, 162, 176, 132, 96, 45, 320, 205];
  let fxActive = false;

  function on1024Day() { const n = Date.now(); return n >= CD_TARGET && n < CD_END; }

  // 烟花画布跟着当前舞台尺寸走（切 tab 后舞台会变）
  function sizeFx() {
    const S = 2;
    fxCv.width = Math.max(1, Math.round(stageW * S));
    fxCv.height = Math.max(1, Math.round(stageH * S));
    fxCv.style.width = stageW + 'px';
    fxCv.style.height = stageH + 'px';
    fxCtx.setTransform(S, 0, 0, S, 0, 0);
  }

  function startFireworks(cont) {
    if (fxActive) return;                        // 已经在放了就不重开
    fxActive = true;
    sizeFx();
    fxCv.style.display = 'block';
    const ctx = fxCtx;

    const rockets = [], sparks = [];
    const TOTAL = 16;                            // 只在一轮模式下用：开场连放 16 发
    let t0 = 0, last = 0, nextAt = 0, launched = 0;

    function boom(x, y, hue) {
      const n = 70 + ((Math.random() * 60) | 0);
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 + Math.random() * 0.12;
        const sp = 130 + Math.random() * 230;
        sparks.push({
          x: x, y: y, px: x, py: y,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          hue: hue + (Math.random() * 30 - 15),
          lit: 62 + Math.random() * 22,
          w: 1.1 + Math.random() * 1.4,
          life: 1.4 + Math.random() * 1.1
        });
      }
    }

    function fire() {
      const x = stageW * (0.12 + Math.random() * 0.76);
      rockets.push({
        x: x, y: stageH + 10, px: x, py: stageH + 10,
        vx: (Math.random() - 0.5) * 46,
        vy: -(stageH * 0.82 + Math.random() * stageH * 0.30),
        apex: stageH * (0.10 + Math.random() * 0.34),
        hue: FX_HUES[(Math.random() * FX_HUES.length) | 0]
      });
    }

    function frame(t) {
      if (!t0) { t0 = t; last = t; }
      const el = (t - t0) / 1000;
      const dt = Math.min(0.05, (t - last) / 1000) || 0.016;
      last = t;

      // 开场先密集放 16 发，之后（持续模式）转成不紧不慢的一直放
      if (launched < TOTAL) {
        if (el >= nextAt) {
          launched++;
          fire();
          nextAt = el + 0.22 + Math.random() * 0.55;
        }
      } else if (cont && el >= nextAt) {
        fire();
        nextAt = el + 0.55 + Math.random() * 0.75;
      }

      ctx.clearRect(0, 0, stageW, stageH);
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';

      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        r.px = r.x; r.py = r.y;
        r.vy += 620 * dt;
        r.x += r.vx * dt; r.y += r.vy * dt;
        ctx.strokeStyle = 'hsla(' + r.hue + ',100%,74%,.95)';
        ctx.lineWidth = 2.4;
        ctx.beginPath(); ctx.moveTo(r.px, r.py); ctx.lineTo(r.x, r.y); ctx.stroke();
        if (r.y <= r.apex || r.vy >= -60) { boom(r.x, r.y, r.hue); rockets.splice(i, 1); }
      }

      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.px = s.x; s.py = s.y;
        s.vy += 95 * dt;
        s.vx *= 0.984; s.vy *= 0.984;
        s.x += s.vx * dt; s.y += s.vy * dt;
        s.life -= dt;
        if (s.life <= 0) { sparks.splice(i, 1); continue; }
        const a = Math.min(1, s.life / 1.3);
        ctx.strokeStyle = 'hsla(' + s.hue + ',96%,' + s.lit + '%,' + a.toFixed(3) + ')';
        ctx.lineWidth = s.w;
        ctx.beginPath(); ctx.moveTo(s.px, s.py); ctx.lineTo(s.x, s.y); ctx.stroke();
      }

      ctx.globalCompositeOperation = 'source-over';
      if (cont) {
        if (!on1024Day()) { stopFx(); return; }      // 过了 1024 当天就收工
        fxRaf = requestAnimationFrame(frame);
      } else if (rockets.length || sparks.length || launched < TOTAL) {
        fxRaf = requestAnimationFrame(frame);
      } else {
        stopFx();
      }
    }
    fxRaf = requestAnimationFrame(frame);
  }

  function stopFx() {
    if (fxRaf) { cancelAnimationFrame(fxRaf); fxRaf = null; }
    fxActive = false;
    fxCtx.setTransform(1, 0, 0, 1, 0, 0);
    fxCtx.clearRect(0, 0, fxCv.width, fxCv.height);
    fxCv.style.display = 'none';
  }

  /* ================= 主角模式：600 位 Builder 的头像拼出一个人 =================
     格网默认 25×24 = 600 格，一格放一位成员；每格挑"主色调最接近主角头像对应像素"的那位，
     颜色稀少时同一位成员可以占多格（复用补位），于是 600 张脸拼成一幅像素画。
     零额外存储、零滤镜：整面墙的颜色全部来自每位成员头像自己的主色调。
     像素精度档位（低/中/高/最高）只改格网密度：格子越多，五官越细，复用节点也越多。 */
  const HERO_LEVELS = [
    { label: '低',   cols: 20, rows: 19 },   // 380 格
    { label: '中',   cols: 25, rows: 24 },   // 600 格：一格一人（默认）
    { label: '高',   cols: 35, rows: 34 },   // 1190 格
    { label: '最高', cols: 50, rows: 48 }    // 2400 格
  ];
  // 星流直接引用同一套精度档位（只读，不修改 HERO_LEVELS）
  const FLOW_LEVELS = HERO_LEVELS;
  let heroLevel = 1;
  let H_COLS = HERO_LEVELS[heroLevel].cols, H_ROWS = HERO_LEVELS[heroLevel].rows, H_N = H_COLS * H_ROWS;
  // 主角秀：名字（停久一点，够看清）↔ 像素画人像 来回循环；HERO_MS 正好是 2 个完整来回
  const CLOCK_MS = 8000, HERO_MS = 9600, NAME_MS = 2800, MOSAIC_MS = 2000;

  let heroOn = false, heroPerson = -1, heroPhase = 'mosaic';
  let heroLocked = false, heroOver = false, heroWheel = null, heroPhaseT = null, heroIdx = 0;
  let heroLevelT = null;                       // 像素精度滑条：松手后的落档定时器
  let heroGeomCache = null, heroSz = 32;
  let heroWho = null, heroWhoIdx = -1;         // 当前主角的 600 格「这格放谁」
  let heroSearchIdx = -1;

  // 每人头像的"主色调"（去掉透明后取出现最多的颜色簇），只算一次
  const domCol = new Float32Array(people.length * 3);
  for (let i = 0; i < domCol.length; i++) domCol[i] = 128;
  const domColReady = new Uint8Array(people.length);   // 主色是否已写入（区别于“恰好是灰色”）
  const heroColorCache = new Map();      // 主角 index -> { tgt, who }
  const nameSlotCache = new Map();
  const heroIdle = window.requestIdleCallback
    ? function (cb) { requestIdleCallback(cb, { timeout: 300 }); }
    : function (cb) { setTimeout(cb, 14); };

  function computeAvgColors() {
    const S = 12;                                   // 12×12 采样，够统计出一个稳定的主色调
    const cv = document.createElement('canvas'); cv.width = S; cv.height = S;
    const cx = cv.getContext('2d', { willReadFrequently: true });
    let i = 0, round = 0;
    function step() {
      let n = 0, skipped = 0;
      while (i < people.length && n < 60) {
        const p = people[i++]; n++;
        const img = p.img;
        if (!img || !img.complete || !img.naturalWidth) { skipped++; continue; }
        try {
          // 先铺上页面上头像的底色，再画头像——这样取到的是"这块砖看起来是什么颜色"
          cx.fillStyle = '#16202c'; cx.fillRect(0, 0, S, S);
          const s = Math.min(img.naturalWidth, img.naturalHeight);
          cx.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, S, S);
          const d = cx.getImageData(0, 0, S, S).data;
          // 按 32 级量化分桶，取像素最多的那一桶的平均色作为主色调
          const bins = new Map();
          for (let k = 0; k < S * S; k++) {
            const r = d[k * 4], g = d[k * 4 + 1], b = d[k * 4 + 2];
            const key = ((r >> 5) << 6) | ((g >> 5) << 3) | (b >> 5);
            let e = bins.get(key);
            if (!e) { e = [0, 0, 0, 0]; bins.set(key, e); }
            e[0]++; e[1] += r; e[2] += g; e[3] += b;
          }
          let best = null;
          bins.forEach(function (e) { if (!best || e[0] > best[0]) best = e; });
          if (best) {
            domCol[p.index * 3] = best[1] / best[0];
            domCol[p.index * 3 + 1] = best[2] / best[0];
            domCol[p.index * 3 + 2] = best[3] / best[0];
            domColReady[p.index] = 1;
          }
        } catch (e) {}
      }
      if (i < people.length) heroIdle(step);
      else if (skipped && round < 3) { round++; i = 0; heroIdle(step); }
      else {
        // computeAvgColors 与星流共用同一份 domCol：全部就绪时同步置真
        let ready = 0;
        for (let k = 0; k < people.length; k++) ready += domColReady[k];
        if (ready >= people.length) flowColorsOk = true;
      }
    }
    heroIdle(step);
  }

  // 主角头像裁成方形后降采样成 25×24 的目标色块（等比裁剪，不压扁人脸）
  function heroTargetColors(p) {
    const img = p.img;
    if (!img || !img.naturalWidth) return null;      // 还没解码好，稍后重试
    const cv = document.createElement('canvas'); cv.width = H_COLS; cv.height = H_ROWS;
    const c = cv.getContext('2d', { willReadFrequently: true });
    c.fillStyle = '#808080'; c.fillRect(0, 0, H_COLS, H_ROWS);
    try {
      const s = Math.min(img.naturalWidth, img.naturalHeight);
      c.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, H_COLS, H_ROWS);
    } catch (e) {}
    const d = c.getImageData(0, 0, H_COLS, H_ROWS).data;
    const out = new Float32Array(H_N * 3);
    for (let i = 0; i < H_N; i++) {
      out[i * 3] = d[i * 4]; out[i * 3 + 1] = d[i * 4 + 1]; out[i * 3 + 2] = d[i * 4 + 2];
    }
    return out;
  }

  // 像素画配对：为每一格挑"主色调最接近"的那位成员；同一人可以占多格（颜色稀缺时复用），
  // 用「已用次数」做惩罚项，让常见颜色摊到更多人身上、稀有颜色才复用。
  // 返回 Int16Array(H_N)：每一格放谁。
  function heroBuild(protIdx) {
    if (heroWho && heroWhoIdx === protIdx) return heroWho;
    const cached = heroColorCache.get(protIdx);
    const tgt = cached ? cached.tgt : heroTargetColors(people[protIdx]);
    if (!tgt) return null;                 // 主角头像还没解码好：等 decode 完成后重排
    if (!cached) {
      const n = people.length;
      const use = new Int16Array(n);
      const who = new Int16Array(H_N).fill(-1);
      // 复用惩罚随格数反比缩放：格子越多，越该让"最像的那位"上，而不是为了摊开而将就
      const upen = 6 * 600 / H_N;
      for (let c = 0; c < H_N; c++) {
        const tr = tgt[c * 3], tg = tgt[c * 3 + 1], tb = tgt[c * 3 + 2];
        let best = -1, bc = Infinity;
        for (let i = 0; i < n; i++) {
          const dr = domCol[i * 3] - tr, dg = domCol[i * 3 + 1] - tg, db = domCol[i * 3 + 2] - tb;
          const dl = 0.299 * dr + 0.587 * dg + 0.114 * db;
          // 距离 = 色相/饱和度差 + 亮度差（亮度权重更高：脸的形状主要靠明暗结构撑起来）
          const cost = Math.sqrt(dr * dr * 0.7 + dg * dg * 0.9 + db * db * 0.6 + dl * dl * 2.8) + use[i] * upen;
          if (cost < bc) { bc = cost; best = i; }
        }
        if (best >= 0) { who[c] = best; use[best]++; }
      }
      // 缓存满时只淘汰最旧的一批（Map 按插入序），不整体清空：
      // 轮播 8s 一换人，整清会让每到 40 人就周期性全量重算一次卡顿，逐条淘汰则大概率仍命中
      if (heroColorCache.size >= 40) {
        const old = heroColorCache.keys();
        let drop = heroColorCache.size - 39;      // set 之后回到 40 条
        while (drop-- > 0) heroColorCache.delete(old.next().value);
      }
      heroColorCache.set(protIdx, { tgt: tgt, who: who });
    } else {
      heroColorCache.delete(protIdx);            // 命中也重新插入，刷新为「最近使用」
      heroColorCache.set(protIdx, cached);
    }
    heroWho = heroColorCache.get(protIdx).who;
    heroWhoIdx = protIdx;
    return heroWho;
  }

  // 主角秀版式：左边 25×24 马赛克墙，右边一张主角卡
  function heroGeom() {
    const W = Math.max(viewport.clientWidth - 44, 1100);
    const H = Math.max(560, Math.min(Math.round(W * 0.72), viewport.clientHeight - 16));
    const cell = Math.max(8, Math.floor(Math.min((H * 0.82) / H_ROWS, (W * 0.60) / H_COLS)));
    const gridW = H_COLS * cell, gridH = H_ROWS * cell;
    const cardW = Math.max(300, Math.round(W * 0.28));
    const gap = Math.round(W * 0.034);
    const gx = (W - (gridW + gap + cardW)) / 2 + gridW / 2;
    const gy = H * 0.535;
    return { W: W, H: H, cell: cell, gridW: gridW, gridH: gridH, gx: gx, gy: gy,
             gridX: gx - gridW / 2, gridY: gy - gridH / 2,
             cardX: gx + gridW / 2 + gap, cardW: cardW };
  }

  function heroCardPos(g) {
    heroCard.style.left = g.cardX + 'px';
    heroCard.style.top = (g.gridY + g.gridH * 0.06) + 'px';
    heroCard.style.width = g.cardW + 'px';
  }

  // 第一段：600 个头像拼出主角的名字（复用 1024 点阵那套文字采样）
  function heroNameSlots(p, g) {
    let label = p.n;
    if (label.length > 6) label = p.u.length <= 8 ? p.u : label.slice(0, 6);
    const key = label + '|' + Math.round(g.gridW) + 'x' + Math.round(g.gridH);
    let hit = nameSlotCache.get(key);
    if (!hit) {
      const bw = g.gridW, bh = Math.round(g.gridH * 0.56);
      const res = textSlots(label, bw, bh, people.length);
      const ox = g.gridX + (g.gridW - bw) / 2, oy = g.gridY + (g.gridH - bh) / 2;
      hit = { slots: res.slots.map(function (s) { return { x: s.x + ox, y: s.y + oy }; }), cell: res.cell };
      if (nameSlotCache.size > 300) nameSlotCache.clear();
      nameSlotCache.set(key, hit);
    }
    return hit;
  }

  function layoutHero() {
    const g = heroGeomCache = heroGeom();
    heroCardPos(g);
    heroSz = g.cell;                        // 铺满整格，像素块之间只留 1px 的格线
    return { W: g.W, H: g.H, sz: heroSz, showNames: false, apexY: g.H - 40, sphere: null };
  }

  // 同一个人的头像要占多格时，用池子里的"附加节点"补位（不新增图片资源，src 共用同一张）
  const heroExtraPool = [];
  function heroExtra(i) {
    let e = heroExtraPool[i];
    if (e) return e;
    const el = document.createElement('div'); el.className = 'p';
    const av = document.createElement('div'); av.className = 'avatar';
    const img = document.createElement('img'); img.alt = ''; img.loading = 'eager'; img.decoding = 'async';
    av.appendChild(img);
    const nm = document.createElement('div'); nm.className = 'nm';
    el.appendChild(av); el.appendChild(nm);
    // 先收起：预建/悬停时不会在左上角堆一片头像，等 heroPlace 再落位
    el.style.display = 'none';
    el.style.transform = 'translate(-2000px,-2000px)';
    el._lastT = 'off'; el._off = true;
    stage.appendChild(el);
    e = { el: el, img: img, nm: nm, idx: -1 };
    heroExtraPool[i] = e;
    return e;
  }

  // 高档位要大量复用节点：趁空闲分批预建，避免马赛克那一帧一次性造上千节点卡住
  function prewarmExtras() {
    const need = Math.max(0, H_N - people.length);
    let i = 0;
    function step() {
      const end = Math.min(need, i + 200);
      for (; i < end; i++) heroExtra(i);
      if (i < need) heroIdle(step);
    }
    if (need) heroIdle(step);
  }

  function heroLevelUI() {
    const L = HERO_LEVELS[heroLevel];
    if (prInfo) prInfo.textContent = L.label + ' · ' + H_COLS + '×' + H_ROWS + ' = ' + H_N + ' 格';
    if (prMarks) for (let i = 0; i < prMarks.length; i++) prMarks[i].classList.toggle('on', i === heroLevel);
  }

  // 切换像素精度：改格网密度，作废缓存并重排
  function setHeroLevel(lv) {
    lv = Math.max(0, Math.min(HERO_LEVELS.length - 1, lv));
    const changed = lv !== heroLevel;
    heroLevel = lv;
    const L = HERO_LEVELS[lv];
    H_COLS = L.cols; H_ROWS = L.rows; H_N = H_COLS * H_ROWS;
    heroLevelUI();
    if (!changed) return;
    heroWho = null; heroWhoIdx = -1;
    heroColorCache.clear();
    nameSlotCache.clear();
    heroGeomCache = null;
    prewarmExtras();
    if (heroOn) apply();                    // 重取几何并重排（apply 内会调 heroFrame）
  }

  // 拖动像素精度滑条：先把左右两个循环停下（不重排、不换人），松手后再按最终档位重排并恢复
  function heroLevelHold() {
    clearTimeout(heroWheel);                // 暂停轮播换人
    clearTimeout(heroPhaseT);               // 暂停 名字 ↔ 马赛克 循环
    clearTimeout(heroLevelT);
    heroLevelT = setTimeout(heroLevelFlush, 300);
  }

  function heroLevelFlush() {
    clearTimeout(heroLevelT); heroLevelT = null;
    setHeroLevel(+prRange.value);           // 按最终档位重排
    if (heroOn) heroPhaseStep();            // 恢复 名字 ↔ 马赛克 循环
    carouselKick();                         // 恢复/续上轮播（内部有守卫）
  }

  function heroHideExtras() {
    for (let i = 0; i < heroExtraPool.length; i++) {
      const el = heroExtraPool[i].el;
      if (el._off) continue;
      el.style.display = 'none';                 // display 切换不参与 transform 过渡，收起是瞬间的
      el.style.transform = 'translate(-2000px,-2000px)';
      el._lastT = 'off'; el._off = true;
    }
  }

  // 把节点摆到 (x,y)，尺寸走 --sz；动作交给 CSS transition，和别的形态同一套
  function heroPlace(el, x, y, szCss, half) {
    el.style.setProperty('--sz', szCss);
    el.style.transitionDelay = '';
    if (el._off) { el.style.display = ''; el._off = false; }   // 从收起状态恢复：直接落位，不做过渡
    const t = 'translate(' + (x - half).toFixed(2) + 'px,' + (y - half).toFixed(2) + 'px)';
    if (el._lastT !== t) { el.style.transform = t; el._lastT = t; }
  }

  function heroFrame() {
    const g = heroGeomCache || (heroGeomCache = heroGeom());
    const szM = g.cell;                     // 马赛克阶段：每块正好一格
    let pos = null, sz = szM;
    if (heroPhase === 'name') {
      const ns = heroNameSlots(people[heroPerson], g);
      pos = ns.slots;
      sz = Math.max(7, Math.min(g.cell * 1.05, ns.cell * 0.96));
    }
    const half = sz / 2;
    const szCss = sz.toFixed(1) + 'px';

    // 第一段：名字。600 个主节点各就各位，附加节点全部收起
    if (pos) {
      heroHideExtras();
      people.forEach(function (p, i) {
        const s = pos[i] || { x: g.gx, y: g.gy };
        heroPlace(p.el, s.x, s.y, szCss, half);
        p.x = s.x; p.y = s.y; p.rot = 0;
        p.rx = s.x; p.ry = s.y; p.rk = 1; p.rd = 0; p.rs = sz;
      });
      return;
    }

    // 第二段：像素画。按格取人，一格一人；同一人占多格时靠附加节点补位
    const who = heroBuild(heroPerson);
    if (!who) {                              // 主角头像没解码好：先按顺序铺满撑着场面
      people.forEach(function (p, c) {
        const x = g.gridX + (c % H_COLS + 0.5) * g.cell;
        const y = g.gridY + (Math.floor(c / H_COLS) + 0.5) * g.cell;
        heroPlace(p.el, x, y, szCss, half);
        p.x = x; p.y = y; p.rot = 0; p.rx = x; p.ry = y; p.rk = 1; p.rd = 0; p.rs = sz;
      });
      heroHideExtras();
      return;
    }

    const taken = new Uint8Array(people.length);
    let extraSlot = 0;
    for (let c = 0; c < H_N; c++) {
      const pi = who[c];
      if (pi < 0) continue;
      const x = g.gridX + (c % H_COLS + 0.5) * g.cell;
      const y = g.gridY + (Math.floor(c / H_COLS) + 0.5) * g.cell;
      if (!taken[pi]) {
        taken[pi] = 1;
        const p = people[pi];
        heroPlace(p.el, x, y, szCss, half);
        p.x = x; p.y = y; p.rot = 0;
        p.rx = x; p.ry = y; p.rk = 1; p.rd = 0; p.rs = sz;
      } else {
        const e = heroExtra(extraSlot++);
        if (e.idx !== pi) {
          e.idx = pi;
          e.img.src = people[pi].a;
          e.img.alt = people[pi].n;
          e.nm.textContent = people[pi].n;
          e.el.dataset.idx = pi;
        }
        heroPlace(e.el, x, y, szCss, half);
      }
    }
    // 没被用上的成员离场；多余的附加节点也要收起来
    people.forEach(function (p, i) {
      if (taken[i]) return;
      heroPlace(p.el, -800, -800, szCss, half);
      p.x = -800; p.y = -800; p.rot = 0;
      p.rx = -800; p.ry = -800; p.rk = 1; p.rd = 0; p.rs = sz;
    });
    for (let k = extraSlot; k < heroExtraPool.length; k++) {
      const el = heroExtraPool[k].el;
      if (el._off) continue;
      el.style.display = 'none';
      el.style.transform = 'translate(-2000px,-2000px)';
      el._lastT = 'off'; el._off = true;
    }
  }

  // 主角卡片的内容：屏幕和导出 PNG 共用同一份，保证两边写的一样
  function heroCardModel(p) {
    const badges = [];
    if (p.t) badges.push({ txt: p.t, plain: false });
    badges.push({ txt: SRC_LABEL[p.s] || '社区 Builder', plain: !p.t });

    const items = [];
    const w = p.w;
    if (w && w.length) {
      w.forEach(function (t) {
        items.push({
          text: t.k === 'play2'
            ? '参赛作品《' + t.t.replace(/^【1024Builder\s*作品秀】\s*/, '') + '》'
            : '《' + t.t + '》',
          meta: '♥' + t.l + ' · ' + t.r + ' 回复'
        });
      });
    } else {
      if (p.p != null) items.push({ text: '在社区发布过 ' + p.p + ' 条内容', meta: '' });
      items.push({
        text: p.s === 'play1' ? '在 1024 集结帖里报到，留下一张头像'
            : p.s === 'play2' ? '参与了 1024Builder 作品秀'
            : p.s === 'hot' ? '出现在社区热门讨论里'
            : '持续活跃在社区讨论中',
        meta: ''
      });
    }
    return { name: p.n, user: '@' + p.u, badges: badges, items: items };
  }

  function renderHeroCard() {
    const p = people[heroPerson];
    if (!p) return;
    const m = heroCardModel(p);
    heroCard.querySelector('.hcAv img').src = p.a;
    heroCard.querySelector('.hcName').textContent = m.name;
    heroCard.querySelector('.hcUser').textContent = m.user;

    const badges = heroCard.querySelector('.hcBadges');
    badges.textContent = '';
    m.badges.forEach(function (b) {
      const s = document.createElement('span');
      s.className = 'hcBadge' + (b.plain ? ' plain' : '');
      s.textContent = b.txt;
      badges.appendChild(s);
    });

    const list = heroCard.querySelector('.hcList');
    list.textContent = '';
    m.items.forEach(function (it) {
      const li = document.createElement('li');
      const d = document.createElement('span'); d.className = 'dot'; d.textContent = '•';
      const tx = document.createElement('span'); tx.className = 'tx'; tx.textContent = it.text;
      li.appendChild(d); li.appendChild(tx);
      if (it.meta) {
        const mt = document.createElement('span'); mt.className = 'mt'; mt.textContent = it.meta;
        li.appendChild(mt);
      }
      list.appendChild(li);
    });
  }

  function enterHero(idx, locked) {
    if (idx < 0 || idx >= people.length) return;
    if (mode !== 'countdown') { mode = 'countdown'; syncModeButtons(); }
    heroLocked = !!locked;
    heroPerson = idx;
    heroPhase = 'name';
    heroOn = true;
    apply();
    viewport.scrollTo({ left: 0, top: 0, behavior: 'smooth' });
    renderHeroCard();
    // 头像若还没解码好，解码完成后再排一次马赛克，保证一定是"拼出来的那张脸"
    const img = people[idx].img;
    if (img.decode) {
      img.decode().then(function () {
        if (heroOn && heroPerson === idx && img.naturalWidth) heroFrame();
      }).catch(function () {});
    }
    if (!locked) carouselKick();
    heroPhaseStep();                   // 名字 ↔ 像素画 来回循环，直到退出
  }

  // 主角秀的节奏：先立名字，名字停久一点，再散开成像素画人像，如此往复
  function heroPhaseStep() {
    clearTimeout(heroPhaseT);
    const who = heroPerson;
    heroPhaseT = setTimeout(function () {
      if (!heroOn || heroPerson !== who) return;
      heroPhase = heroPhase === 'name' ? 'mosaic' : 'name';
      heroFrame();
      heroPhaseStep();
    }, heroPhase === 'name' ? NAME_MS : MOSAIC_MS);
  }

  function exitHero() {
    clearTimeout(heroPhaseT);
    if (!heroOn) return;
    heroOn = false;
    heroHideExtras();
    apply();
  }

  function lockHero(idx) {
    heroLocked = true;
    clearTimeout(heroWheel);
    enterHero(idx, true);
  }

  function unlockHero() {
    heroLocked = false;
    heroSearchIdx = -1;
    exitHero();
    carouselKick();
  }

  // 倒计时 tab 内低速轮播：时间板 8s ↔ 主角秀 5s，600 人循环
  function carouselKick() {
    clearTimeout(heroWheel);
    if (heroOver || heroLocked || REDUCED || mode !== 'countdown') return;
    if (heroOn) {
      heroWheel = setTimeout(function () { exitHero(); carouselKick(); }, HERO_MS);
    } else {
      heroWheel = setTimeout(function () {
        const idx = heroIdx;
        heroIdx = (heroIdx + 1) % people.length;
        enterHero(idx, false);
      }, on1024Day() ? 0 : CLOCK_MS);       // 1024 当天这个 tab 就是主角秀，不用再等时间板
    }
  }

  heroExit.addEventListener('click', function () { q.value = ''; doSearch(); unlockHero(); });
  if (prRange) {
    prRange.addEventListener('input', heroLevelHold);     // 拖动时先把左边冻住
    prRange.addEventListener('change', heroLevelFlush);   // 松手后按最终档位重排
  }
  // 点任意一张脸（时间板或马赛克里）就让 TA 当主角
  stage.addEventListener('click', function (e) {
    if (mode !== 'countdown') return;
    if (e.target && e.target.closest && e.target.closest('#heroCard')) return;
    const p = pickPerson(e.clientX, e.clientY);
    if (p) lockHero(p.index);
  });
  heroBtn.addEventListener('click', function () {
    if (!hits.length) return;
    setMode('countdown');
    lockHero(hits[0].index);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (heroOn) { q.value = ''; doSearch(); unlockHero(); }
      else if (q.value) { q.value = ''; doSearch(); }
      return;
    }
    if (e.key === 'Enter' && document.activeElement === q && hits.length) {
      setMode('countdown');
      lockHero(hits[0].index);
    }
  });

  /* ================= 启动 ================= */
  // 1024 当天：第一屏直接落在 1024 点阵 + 持续烟花，第一个 tab 改名「主角秀」；
  // 其余时间（含 1024 之后）：正常倒计时，目标自动指向下一个 10-24。
  const onDay0 = on1024Day();
  if (onDay0) {
    mode = 'pixel';
    syncModeButtons();
  }
  createStars();
  apply();
  predecodeAvatars();
  computeAvgColors();
  heroLevelUI();                    // 像素精度滑条：显示当前档位
  initCountdown();                  // 当天会走 enterMemorial：改名 + 烟花 + 排定当晚 24:00 回落
  if (!onDay0) carouselKick();      // 倒计时 tab 内开始低速轮播
})();
</script>
</body>
</html>
