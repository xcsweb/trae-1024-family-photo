  let flowPreset = null;          // 当前收束的预设
  let flowImage = null, flowImageName = '';   // 当前上传图（切档重算用）
  let flowLevel = 2;              // 精度档位：默认「高」35×34=1190
  let flowCols = 35, flowRows = 34, flowCellCount = 1190;
  let flowGrid = null, flowWho = null, flowExtraSlots = [];
  let flowExtrasTimer = null, flowApplyTimer = null, flowApplyTries = 0;
  const FLOW_BAR_H = 164;         // 与 #flowBar 高度一致

  // 把任意图片按 cover 裁切降采样成 cols×rows 的目标色（预设与上传图共用）
  function flowSampleImage(img, cols, rows) {
    const cv = document.createElement('canvas');
    cv.width = cols; cv.height = rows;
    const c = cv.getContext('2d', { willReadFrequently: true });
    c.fillStyle = '#808080'; c.fillRect(0, 0, cols, rows);
    const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
    if (!iw || !ih) return null;
    const sc = Math.max(cols / iw, rows / ih);
    const dw = iw * sc, dh = ih * sc;
    try { c.drawImage(img, (cols - dw) / 2, (rows - dh) / 2, dw, dh); } catch (e) { return null; }
    const d = c.getImageData(0, 0, cols, rows).data;
    const out = new Float32Array(cols * rows * 3);
    for (let i = 0; i < cols * rows; i++) {
      out[i * 3] = d[i * 4]; out[i * 3 + 1] = d[i * 4 + 1]; out[i * 3 + 2] = d[i * 4 + 2];
    }
    return out;
  }

  // 预设图解码后按当前档位取目标色；解不出来回调 null（不中断当前画面）
  function flowPresetColors(preset, cols, rows, cb) {
    const im = new Image();
    let fired = false;
    const fire = function (ok) {
      if (fired) return;
      fired = true;
      cb(ok ? flowSampleImage(im, cols, rows) : null);
    };
    im.onload = function () { fire(true); };
    im.onerror = function () { fire(false); };
    im.src = preset.src;
    if (im.complete && im.naturalWidth) fire(true);
    setTimeout(function () { fire(false); }, 2500);
  }

  // 主色调补齐：computeAvgColors 是分帧闲时算的，进来时可能还没算完，
  // 这里用同一套「分桶取众数」算法补齐；未解码的 400ms 后重试（最多 20 次），
  // 在全部拿到颜色前不把 flowColorsOk 置真。
  let flowEnsureTimer = null, flowEnsureTries = 0;
  function flowEnsureColors(retry) {
    if (flowColorsOk) return;
    if (!retry) {
      clearTimeout(flowEnsureTimer); flowEnsureTimer = null;
      flowEnsureTries = 0;
    }
    const S = 12;
    const cv = document.createElement('canvas'); cv.width = S; cv.height = S;
    const c = cv.getContext('2d', { willReadFrequently: true });
    let left = 0;
    people.forEach(function (p) {
      const i = p.index * 3;
      if (domColReady[p.index]) return;
      const img = p.img;
      if (!img || !img.complete || !img.naturalWidth) { left++; return; }
      try {
        c.fillStyle = '#16202c'; c.fillRect(0, 0, S, S);
        const s = Math.min(img.naturalWidth, img.naturalHeight);
        c.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, S, S);
        const d = c.getImageData(0, 0, S, S).data;
        const bins = new Map();
        for (let k = 0; k < S * S; k++) {
          const r = d[k * 4], g = d[k * 4 + 1], b = d[k * 4 + 2];
          const key = ((r >> 5) << 6) | ((g >> 5) << 3) | (b >> 5);
          let e = bins.get(key);
          if (!e) { e = [0, 0, 0, 0]; bins.set(key, e); }
          e[0]++; e[1] += r; e[2] += g; e[3] += b;
        }
        let best = null;
        bins.forEach(function (e) { if (!best || e[0] > best[0]) best = e; });
        if (best) {
          domCol[i] = best[1] / best[0];
          domCol[i + 1] = best[2] / best[0];
          domCol[i + 2] = best[3] / best[0];
        }
        domColReady[p.index] = 1;
      } catch (e) {}
    });
    if (!left) {
      flowColorsOk = true;
      clearTimeout(flowEnsureTimer); flowEnsureTimer = null;
      flowEnsureTries = 0;
    } else if (flowEnsureTries < 20) {
      flowEnsureTries++;
      clearTimeout(flowEnsureTimer);
      flowEnsureTimer = setTimeout(function () { flowEnsureColors(true); }, 400);
    }
  }

  // 大部分成员有主色才允许匹配（少量坏图不至于永远卡住）
  function flowColorsReady() {
    if (flowColorsOk) return true;
    let ready = 0;
    for (let i = 0; i < people.length; i++) ready += domColReady[i];
    return ready >= Math.ceil(people.length * 0.9);
  }

  // ---- 轻量 2D 值噪声（不引依赖）：整数格点随机 + smoothstep 双线性插值 ----
  function flowGridDot(ix, iy) {
    let h = (ix * 374761393 + iy * 668265263) | 0;
    h = (h ^ (h >>> 13)) * 1274126177 | 0;
    h = h ^ (h >>> 16);
    return (h >>> 0) / 2147483648 - 1;        // [-1, 1)
  }
  function flowSmooth(t) { return t * t * (3 - 2 * t); }
  function flowNoise(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = flowSmooth(x - ix), fy = flowSmooth(y - iy);
    const a = flowGridDot(ix, iy), b = flowGridDot(ix + 1, iy);
    const c = flowGridDot(ix, iy + 1), d = flowGridDot(ix + 1, iy + 1);
    const top = a + (b - a) * fx;
    return top + ((c + (d - c) * fx) - top) * fy;
  }

  let flowColorsOk = false;
  let flowRaf = null, flowLast = 0, flowT = 0;
  let flowW = 0, flowH = 0, flowSz = 30, flowPx = 0, flowPy = 0;
  let flowMouse = null, flowMouseLast = 0;
  let flowTrailScale = 0.5;
  let flowState = 'free';          // free | text | image | preset
  let flowSlots = null;            // 收束目标槽位
  let flowSquare = false;          // 收束目标是否方形格
  let flowFps = 0, flowPerfChecked = false;
  let flowFrames = 0, flowStartTs = 0;
  let flowCanvasMode = false;      // 帧率不足时的画布渲染兜底
  let flowEverCanvas = false;      // 本会话是否已判定需要画布渲染（下次进入直接走 WebGL，跳过 0.7s 掉帧探测）

  // 舞台内的流场几何：主体区在标题之下，26-40px 的头像按面积换算尺寸
  function flowGeom() {
    const W = Math.max(760, viewport.clientWidth - 44);
    const H = Math.max(430, Math.min(Math.round(W * 0.62), Math.round(window.innerHeight * 0.86)));
    const sz = Math.max(22, Math.min(40, 30 * Math.sqrt((W * H) / (1440 * 900))));
    return { W: W, H: H, sz: sz };
  }

  function flowRandom(p, salt) { return hash(p.index, salt); }

  function flowInitPeople(W, H, sz) {
    const x0 = 84, x1 = W - 84, y0 = 122, y1 = H - FLOW_BAR_H - 26;
    flowPx = 0.0030;
    flowPy = flowPx * (W / Math.max(1, H));
    people.forEach(function (p) {
      if (!(p.x > 0 && p.x < W && p.y > 100 && p.y < y1)) {
        p.x = x0 + flowRandom(p, 71) * (x1 - x0);
        p.y = y0 + flowRandom(p, 72) * (y1 - y0);
      }
      p._gx = x0 + flowRandom(p, 75) * (x1 - x0);
      p._gy = y0 + flowRandom(p, 76) * (y1 - y0);
      p._baseSz = sz * (0.84 + flowRandom(p, 74) * 0.3);
      p._spd = 0.6 + flowRandom(p, 78) * 0.9;
      p._spin = (flowRandom(p, 79) - 0.5) * 0.22;
      p.rot = (flowRandom(p, 73) - 0.5) * 40;
      p.rs = p._baseSz;
      p.rx = p.x; p.ry = p.y;
      p.rk = 1; p.rd = 0; p.rop = 1;
      p._hole = false; p._mv = 0;
      p._kick = 0; p._kx = 0; p._ky = 0;
      p._bx = 0; p._by = 0;
      p.el.style.opacity = '';
      p.el.style.transitionDelay = '';
      p.el.style.setProperty('--sz', FLOW_BASE + 'px');   // 基准尺寸固定，显示大小交给 transform:scale
      p.el.style.zIndex = '';
      p._lastT = '';
      p._lastOp = '';
    });
  }

  function flowStart() {
    if (mode !== 'flow') return;
    flowEnsureColors();
    flowSetLevelUI();
    flowHideExtras();
    flowFps = 0; flowPerfChecked = false;
    flowFrames = 0; flowStartTs = 0;
    flowTrailClear(true);
    if (REDUCED) { flowRedrawStatic(); return; }   // 减弱动效：只画一帧静态构图
    if (!flowRaf) { flowLast = 0; flowRaf = requestAnimationFrame(flowTick); }
  }

  function flowStop() {
    if (flowRaf) { cancelAnimationFrame(flowRaf); flowRaf = null; }
    flowLast = 0;
    if (flowCanvasMode) flowSetCanvasMode(false);
    flowHideExtras();
    flowTrailClear(false);
    document.body.classList.remove('flow-image', 'flow-preset', 'flow-canvas');
    flowState = 'free';
    flowSlots = null;
    flowSquare = false;
    flowPreset = null;
    flowGrid = null; flowWho = null; flowExtraSlots = []; flowSlotColor = null;
    flowImage = null; flowImageName = '';
    clearTimeout(flowApplyTimer); flowApplyTimer = null; flowApplyTries = 0;
    flowClearTints();
    flowMouse = null;
  }

  // 减弱动效 / 暂停时只画一帧，控制条仍可用
  function flowRedrawStatic() {
    flowTrailClear(true);
    if (flowState === 'free') flowFreeFrame(flowT);
    else flowSeekFrame();
    if (flowCanvasMode) flowGLDraw();
  }

  // 逐帧写 transform + 透明度；不做 CSS 过渡，所见即所得
  // 头像基准尺寸固定为 40px，显示大小用 transform 的 scale 控制：
  // 这样每帧只改 transform，不触发布局回流（性能关键）。
  const FLOW_BASE = 40;
  function flowWrite(p, square) {
    const a = Math.max(0, Math.min(1, p.rop));
    const sz = p.rs;
    // 画布模式下 .p 不参与合成，就完全别写样式，省掉 600 次样式重算
    if (!flowCanvasMode) {
      // 视觉尺寸 = 基准尺寸 × (大小/40) × 淡出系数，全部并进 transform，不写宽高
      const vis = Math.max(0.001, sz * Math.max(0.16, a) / FLOW_BASE);
      const bx = p._bx || 0, by = p._by || 0;
      const t = 'translate(' + (p.x + bx - FLOW_BASE / 2).toFixed(2) + 'px,' + (p.y + by - FLOW_BASE / 2).toFixed(2) + 'px)' +
                ' rotate(' + p.rot.toFixed(2) + 'deg) scale(' + vis.toFixed(3) + ')';
      if (p._lastT !== t) { p.el.style.transform = t; p._lastT = t; }
      // 透明度按 0.05 粒度写，收敛过程中不会每帧都改样式
      const op = a > 0.995 ? '' : String(Math.round(a * 20) / 20);
      if (p._lastOp !== op) { p.el.style.opacity = op; p._lastOp = op; }
    }
    if (flowCtx && square && a > 0.03) {
      // 只在方块格（图片/预设收束）时描格线；自由流动已有 CSS 圆边，省掉 600 次描边
      flowCtx.strokeStyle = 'rgba(255,255,255,' + (0.10 * a).toFixed(3) + ')';
      flowCtx.lineWidth = 1;
      flowCtx.strokeRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
    }
  }

  // 星流画布：背景底 + 按主色的点彩拖尾，总比 stage 低一半分辨率省开销
  function flowSizeCanvas(scale) {
    flowTrailScale = scale;
    flowCv.width = Math.max(1, Math.round(flowW * scale));
    flowCv.height = Math.max(1, Math.round(flowH * scale));
    flowCv.style.width = flowW + 'px';
    flowCv.style.height = flowH + 'px';
    flowTrailClear(true);
  }

  function flowTrailClear(hard) {
    flowCtx.setTransform(1, 0, 0, 1, 0, 0);
    flowCtx.clearRect(0, 0, flowCv.width, flowCv.height);
    if (hard) {
      const g = flowCtx.createLinearGradient(0, 0, 0, flowCv.height);
      g.addColorStop(0, '#0b1220');
      g.addColorStop(0.55, '#080c14');
      g.addColorStop(1, '#05080e');
      flowCtx.fillStyle = g;
      flowCtx.fillRect(0, 0, flowCv.width, flowCv.height);
    }
    flowCtx.setTransform(flowTrailScale, 0, 0, flowTrailScale, 0, 0);
  }

  // 目标槽位：按当前精度档位生成可变 cols×rows 网格，
  // 可用高度避开顶部标题（102px）与底部通栏控制条（FLOW_BAR_H）。
  function flowGridSlots(W, H, cols, rows) {
    const top = 102, bottom = FLOW_BAR_H + 8;
    const availW = W * 0.90, availH = Math.max(120, H - top - bottom);
    const cell = Math.max(3, Math.min(availW / cols, availH / rows));
    const ox = (W - cols * cell) / 2;
    const oy = top + (availH - rows * cell) / 2;
    const slots = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        slots.push({ x: ox + (c + 0.5) * cell, y: oy + (r + 0.5) * cell, col: c, row: r });
      }
    }
    return { slots: slots, cell: cell, ox: ox, oy: oy, cols: cols, rows: rows };
  }

  function flowColorCost(i, tr, tg, tb) {
    const dr = domCol[i * 3] - tr, dg = domCol[i * 3 + 1] - tg, db = domCol[i * 3 + 2] - tb;
    const dl = 0.299 * dr + 0.587 * dg + 0.114 * db;
    return Math.sqrt(dr * dr * 0.7 + dg * dg * 0.9 + db * db * 0.6 + dl * dl * 2.8);
  }

  // 颜色配对：去掉“每人只能用一次”的硬限制，改成 use 计数 + upen 惩罚，
  // 与主角秀 heroBuild 完全一致——稀有色会被复用，铺满高精度格网。
  function flowMatchColors(tgt, slots) {
    const n = people.length, m = slots.length;
    const use = new Int16Array(n);
    const who = new Int16Array(m).fill(-1);
    const upen = 6 * 600 / Math.max(1, m);
    for (let k = 0; k < m; k++) {
      const tr = tgt[k * 3], tg = tgt[k * 3 + 1], tb = tgt[k * 3 + 2];
      let best = -1, bc = Infinity;
      for (let i = 0; i < n; i++) {
        const cost = flowColorCost(i, tr, tg, tb) + use[i] * upen;
        if (cost < bc) { bc = cost; best = i; }
      }
      if (best < 0) continue;
      who[k] = best;
      use[best]++;
    }
    // 格数充足时保证 600 位成员每人至少占一格：从“已被复用”的格里换出最划算的一格
    if (m >= n) {
      for (let i = 0; i < n; i++) {
        if (use[i] > 0) continue;
        let bestC = -1, bestD = Infinity, bestO = -1;
        for (let c = 0; c < m; c++) {
          const o = who[c];
          if (o < 0 || use[o] < 2) continue;
          const tr = tgt[c * 3], tg = tgt[c * 3 + 1], tb = tgt[c * 3 + 2];
          const d = flowColorCost(i, tr, tg, tb) - flowColorCost(o, tr, tg, tb);
          if (d < bestD) { bestD = d; bestC = c; bestO = o; }
        }
        if (bestC >= 0) { who[bestC] = i; use[bestO]--; use[i]++; }
      }
    }
    return who;
  }

  // 名画/图片收束：每格底色直接用「目标色」（不是成员主色），头像用 soft-light 叠纹理。
  // 明暗结构由目标色决定，头像只贡献细节，这是整幅画能被认出来的关键。
  let flowSlotColor = null;    // 当前收束每个槽位的目标色（m*3）
  function flowApplyTints() {
    people.forEach(function (p) {
      const av = p.el.firstElementChild;
      if (!av) return;
      const k = p._tgtK;
      let col;
      if (flowSlotColor && k != null && k >= 0) {
        col = 'rgb(' + (flowSlotColor[k * 3] | 0) + ',' + (flowSlotColor[k * 3 + 1] | 0) + ',' + (flowSlotColor[k * 3 + 2] | 0) + ')';
      } else {
        col = 'rgb(' + (domCol[p.index * 3] | 0) + ',' + (domCol[p.index * 3 + 1] | 0) + ',' + (domCol[p.index * 3 + 2] | 0) + ')';
      }
      av.style.backgroundColor = col;
    });
  }

  // 退出名画/图片收束：头像底色恢复，避免带回自由流动
  function flowClearTints() {
    people.forEach(function (p) {
      const av = p.el.firstElementChild;
      if (av) av.style.backgroundColor = '';
    });
  }

  // 每人只取第一优先格做收束动画，其余格交给附加节点池
  function flowAssign(tgt, grid) {
    const who = flowMatchColors(tgt, grid.slots);
    const first = new Int16Array(people.length).fill(-1);
    const extras = [];
    for (let c = 0; c < who.length; c++) {
      const pi = who[c];
      if (pi < 0) continue;
      if (first[pi] < 0) first[pi] = c;
      else extras.push({ m: pi, slot: grid.slots[c], k: c });
    }
    const slots = new Array(people.length).fill(null);
    for (let i = 0; i < people.length; i++) {
      if (first[i] >= 0) slots[i] = grid.slots[first[i]];
      people[i]._tgtK = first[i];
    }
    flowSlotColor = tgt;
    flowSlots = slots;
    flowWho = who;
    flowGrid = grid;
    flowExtraSlots = extras;
    flowSz = Math.max(4, grid.cell * 0.96);
    flowSquare = true;
    flowPrewarmExtras(extras.length);
  }

  // 附加节点池：同一成员占多格时补位，src 复用 people[idx] 的图片
  const flowExtraPool = [];
  function flowExtra(i) {
    let e = flowExtraPool[i];
    if (e) return e;
    const el = document.createElement('div'); el.className = 'p';
    const av = document.createElement('div'); av.className = 'avatar';
    const img = document.createElement('img'); img.alt = ''; img.loading = 'eager'; img.decoding = 'async';
    av.appendChild(img);
    const tint = document.createElement('div'); tint.className = 'tint';
    av.appendChild(tint);
    const nm = document.createElement('div'); nm.className = 'nm';
    el.appendChild(av); el.appendChild(nm);
    el.style.display = 'none';
    el.style.transform = 'translate(-2000px,-2000px)';
    el._lastT = 'off'; el._off = true;
    stage.appendChild(el);
    e = { el: el, av: av, img: img, nm: nm, tint: tint, idx: -1 };
    flowExtraPool[i] = e;
    return e;
  }

  let flowPrewarmTimer = null;
  function flowPrewarmExtras(need) {
    clearTimeout(flowPrewarmTimer); flowPrewarmTimer = null;
    let i = flowExtraPool.length;
    if (need <= i) return;
    function step() {
      const end = Math.min(need, i + 90);
      for (; i < end; i++) flowExtra(i);
      if (i < need) flowPrewarmTimer = setTimeout(step, 16);
    }
    step();
  }

  let flowExtrasShown = false;
  function flowHideExtras() {
    clearTimeout(flowExtrasTimer); flowExtrasTimer = null;
    flowExtrasShown = false;
    for (let i = 0; i < flowExtraPool.length; i++) {
      const el = flowExtraPool[i].el;
      if (el._off) continue;
      el.style.opacity = '0';
      el.style.display = 'none';
      el.style.transform = 'translate(-2000px,-2000px)';
      el._lastT = 'off'; el._off = true;
    }
  }

  // extras 只写一次 transform（收束完成后），不参与逐帧 rAF；入场仅 280ms 透明度淡入
  function flowPlaceExtras() {
    if (mode !== 'flow' || !flowSquare || !flowGrid || (flowState !== 'preset' && flowState !== 'image')) {
      flowHideExtras(); return;
    }
    const szCss = flowSz.toFixed(2) + 'px';
    const half = flowSz / 2;
    const list = flowExtraSlots;
    const fresh = [];
    for (let i = 0; i < list.length; i++) {
      const m = list[i].m, slot = list[i].slot;
      const e = flowExtra(i);
      if (e.idx !== m) {
        e.idx = m;
        const src = people[m].img.src;
        if (e.img.src !== src) e.img.src = src;
        e.el.dataset.idx = m;
        e.nm.textContent = people[m].n;
        const col = (flowSlotColor && slot.k != null && slot.k >= 0)
          ? 'rgb(' + (flowSlotColor[slot.k * 3] | 0) + ',' + (flowSlotColor[slot.k * 3 + 1] | 0) + ',' + (flowSlotColor[slot.k * 3 + 2] | 0) + ')'
          : 'rgb(' + (domCol[m * 3] | 0) + ',' + (domCol[m * 3 + 1] | 0) + ',' + (domCol[m * 3 + 2] | 0) + ')';
        e.av.style.backgroundColor = col;
        e.tint.style.background = col;
      }
      e.el.style.setProperty('--sz', szCss);
      const t = 'translate(' + (slot.x - half).toFixed(2) + 'px,' + (slot.y - half).toFixed(2) + 'px)';
      if (e.el._lastT !== t) { e.el.style.transform = t; e.el._lastT = t; }
      e.el.style.transition = 'opacity .28s ease';
      if (e.el._off) { e.el.style.display = ''; e.el._off = false; }
      if (e.el._lastOp !== 'in') {
        e.el.style.opacity = '0';
        e.el._lastOp = 'in';
        fresh.push(e.el);
      }
    }
    // 多余的池节点收起
    for (let i = list.length; i < flowExtraPool.length; i++) {
      const el = flowExtraPool[i].el;
      if (!el._off) {
        el.style.display = 'none';
        el.style.transform = 'translate(-2000px,-2000px)';
        el._lastT = 'off'; el._off = true;
      }
    }
    flowExtrasShown = list.length > 0;
    if (fresh.length) {
      void stage.offsetWidth;   // 让 opacity:0 先落一帧，再淡入
      requestAnimationFrame(function () {
        for (let i = 0; i < fresh.length; i++) fresh[i].style.opacity = '';
      });
    }
  }

  function flowExtrasSoon() {
    clearTimeout(flowExtrasTimer); flowExtrasTimer = null;
    if (REDUCED) { flowPlaceExtras(); return; }
    flowExtrasTimer = setTimeout(flowPlaceExtras, 1100);
  }

  // 精度档位：直接引用主角秀的 HERO_LEVELS（只读，不修改）
  function flowLevelSync() {
    const L = FLOW_LEVELS[flowLevel];
    flowCols = L.cols; flowRows = L.rows;
    flowCellCount = flowCols * flowRows;
  }

  function flowSetLevelUI() {
    flowLevelSync();
    if (flowLvInfo) flowLvInfo.textContent = FLOW_LEVELS[flowLevel].label + ' · ' + flowCols + '×' + flowRows + ' = ' + flowCellCount + ' 格';
    for (let i = 0; i < flowLevelBtns.length; i++) {
      flowLevelBtns[i].classList.toggle('on', +flowLevelBtns[i].dataset.lv === flowLevel);
    }
  }

  function flowSetLevel(lv) {
    lv = Math.max(0, Math.min(FLOW_LEVELS.length - 1, lv));
    if (lv === flowLevel) { flowSetLevelUI(); return; }
    flowLevel = lv;
    flowSetLevelUI();
    clearTimeout(flowApplyTimer); flowApplyTimer = null; flowApplyTries = 0;
    clearTimeout(flowExtrasTimer); flowExtrasTimer = null;
    flowHideExtras();
    flowWho = null; flowGrid = null; flowExtraSlots = [];
    flowSlotColor = null;
    // 文字收束不受影响；名画 / 上传图按新档位重算
    if (flowState === 'preset' && flowPreset) flowApplyPreset(flowPreset);
    else if (flowState === 'image' && flowImage) flowApplyImage(flowImage, flowImageName);
  }

  window.__flowDbg = function () {
    return { who: flowWho ? Array.from(flowWho) : null, grid: flowGrid, square: flowSquare,
      col: Array.from(domCol), tgt: flowDbgTgt ? Array.from(flowDbgTgt) : null,
      extrasShown: flowExtrasShown, extraSlots: flowExtraSlots.length, pool: flowExtraPool.length,
      atlas: flowAtlasS ? flowAtlasS.toDataURL('image/png') : (flowAtlasC ? flowAtlasC.toDataURL('image/png') : null) };
  };
  let flowDbgTgt = null;

  // 拖尾：半透明填充做渐隐，再按主色点彩
  let flowTrailFrame = 0;
  function flowTrail(dt) {
    const ctx = flowCtx;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    // 渐隐每两帧做一次（幅度加倍），省一成全画布填充
    if ((++flowTrailFrame & 1) === 0) {
      ctx.fillStyle = 'rgba(5,8,14,' + Math.min(0.26, dt * 5.6).toFixed(3) + ')';
      ctx.fillRect(0, 0, flowCv.width, flowCv.height);
    }
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < people.length; i += 4) {
      const p = people[i];
      // 只在真的在移动时点彩：收束后原地不动的人不该继续堆白点
      if (p.rop < 0.04 || (p._mv || 0) < 0.5) continue;
      const r = domCol[i * 3] | 0, g = domCol[i * 3 + 1] | 0, b = domCol[i * 3 + 2] | 0;
      ctx.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ',.42)';
      const s = Math.max(1.2, p.rs * 0.2);
      ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.setTransform(flowTrailScale, 0, 0, flowTrailScale, 0, 0);
    if (flowCanvasMode) flowGLDraw();
  }

  // 画布渲染兜底：把所有头像预裁成一张图集（25×24 格，48px），避免每帧 600 次 clip / 纹理切换
  const FLOW_CELL = 48;
  let flowAtlasC = null, flowAtlasS = null;
  let flowAtlasMissC = 0, flowAtlasMissS = 0;   // 没画进图集的头像数（图片还没解码完）
  function flowBuildAtlas(square, force) {
    if (!force && (square ? flowAtlasS : flowAtlasC)) return;
    const cols = 25, rows = 24;
    const cv = document.createElement('canvas');
    cv.width = cols * FLOW_CELL; cv.height = rows * FLOW_CELL;
    const c = cv.getContext('2d');
    let miss = 0;
    people.forEach(function (p, i) {
      const img = p.img;
      if (!img || !img.complete || !img.naturalWidth) { miss++; return; }
      const cx = (i % cols) * FLOW_CELL, cy = Math.floor(i / cols) * FLOW_CELL;
      c.save();
      if (!square) {
        c.beginPath(); c.arc(cx + FLOW_CELL / 2, cy + FLOW_CELL / 2, FLOW_CELL / 2 - 1, 0, Math.PI * 2); c.clip();
      }
      const iw = img.naturalWidth, ih = img.naturalHeight, s = Math.min(iw, ih);
      // 图块本身保持头像原色；名画模式的目标色由 WebGL 每实例的 tint 属性在着色器里
      // 做 soft-light 混合（与 DOM 的 background-color + mix-blend-mode 一致）
      c.drawImage(img, (iw - s) / 2, (ih - s) / 2, s, s, cx, cy, FLOW_CELL, FLOW_CELL);
      c.restore();
    });
    if (square) { flowAtlasS = cv; flowAtlasMissS = miss; }
    else { flowAtlasC = cv; flowAtlasMissC = miss; }
  }

  /* ---- WebGL 精灵渲染：600 个实例化四边形，远快于 canvas2d 的逐张 drawImage ---- */
  const flowGlCv = document.getElementById('flowGL');
  let gl = null, glProg = null, glInstBuf = null, glInstData = null;
  let glTexC = null, glTexS = null, glResLoc = null, glSqLoc = null, glReady = false;

  function flowGLInit() {
    if (gl || !flowGlCv) return;
    try { gl = flowGlCv.getContext('webgl2', { alpha: true, antialias: false, premultipliedAlpha: true, depth: false }); } catch (e) { gl = null; }
    if (!gl) return;
    const vsSrc = '#version 300 es\n' +
      'in vec2 corner; in vec2 off; in float size; in float rot; in float alpha; in vec2 uv0; in vec3 tint;\n' +
      'uniform vec2 res;\n' +
      'out vec2 vuv; out float va; out vec3 vc;\n' +
      'void main(){ float s=sin(rot), c=cos(rot); vec2 p=corner*size;\n' +
      '  vec2 r=vec2(p.x*c-p.y*s, p.x*s+p.y*c)+off;\n' +
      '  gl_Position=vec4(r.x/res.x*2.0-1.0, 1.0-r.y/res.y*2.0, 0.0, 1.0);\n' +
      '  vuv=uv0+vec2((corner.x+0.5)/25.0,(corner.y+0.5)/24.0); va=alpha; vc=tint; }';
    const fsSrc = '#version 300 es\n' +
      'precision mediump float; in vec2 vuv; in float va; in vec3 vc; uniform sampler2D tex; uniform float sq; out vec4 o;\n' +
      'vec3 softlight(vec3 b, vec3 s){\n' +
      '  return mix(b - (1.0-2.0*s)*b*(1.0-b), b + (2.0*s-1.0)*(sqrt(b)-b), step(0.5, s));\n' +
      '}\n' +
      'void main(){ vec4 t=texture(tex,vuv); vec3 rgb=t.rgb;\n' +
      '  if (sq > 0.5) rgb = softlight(vc, rgb);\n' +
      '  o=vec4(rgb*t.a*va, t.a*va); }';
    function sh(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) return null;
      return s;
    }
    const vs = sh(gl.VERTEX_SHADER, vsSrc), fs = sh(gl.FRAGMENT_SHADER, fsSrc);
    if (!vs || !fs) { gl = null; return; }
    const pr = gl.createProgram();
    gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { gl = null; return; }
    glProg = pr; gl.useProgram(pr);

    const cbuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, cbuf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-0.5, -0.5, 0.5, -0.5, -0.5, 0.5, 0.5, 0.5]), gl.STATIC_DRAW);
    const cl = gl.getAttribLocation(pr, 'corner');
    gl.enableVertexAttribArray(cl);
    gl.vertexAttribPointer(cl, 2, gl.FLOAT, false, 0, 0);

    glInstBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, glInstBuf);
    glInstData = new Float32Array((people.length + 2400) * 10);
    const stride = 10 * 4;
    [['off', 2, 0], ['size', 1, 8], ['rot', 1, 12], ['alpha', 1, 16], ['uv0', 2, 20], ['tint', 3, 28]].forEach(function (a) {
      const l = gl.getAttribLocation(pr, a[0]);
      gl.enableVertexAttribArray(l);
      gl.vertexAttribPointer(l, a[1], gl.FLOAT, false, stride, a[2]);
      gl.vertexAttribDivisor(l, 1);
    });
    glResLoc = gl.getUniformLocation(pr, 'res');
    glSqLoc = gl.getUniformLocation(pr, 'sq');
    gl.uniform1i(gl.getUniformLocation(pr, 'tex'), 0);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.disable(gl.DEPTH_TEST);
    glReady = true;
  }

  function flowGLUpload(square, force) {
    flowBuildAtlas(square, force);
    const src = square ? flowAtlasS : flowAtlasC;
    if (!src) return;
    const old = square ? glTexS : glTexC;
    if (old && !force) return;
    const t = old || gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);   // UV 的 v 轴与图集行号同向，避免整块像素画被上下翻乱
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    if (square) glTexS = t; else glTexC = t;
  }

  function flowGLResize() {
    if (!glReady) return;
    if (flowGlCv.width !== Math.round(flowW) || flowGlCv.height !== Math.round(flowH)) {
      flowGlCv.width = Math.round(flowW);
      flowGlCv.height = Math.round(flowH);
    }
    flowGlCv.style.width = flowW + 'px';
    flowGlCv.style.height = flowH + 'px';
    gl.viewport(0, 0, flowGlCv.width, flowGlCv.height);
  }

  function flowGLDraw() {
    if (!glReady) return false;
    if (flowCanvasMode) {
      // 图集初次构建时可能还有头像没解码完，运行时补一次（最多补 15 秒）
      const miss = flowSquare ? flowAtlasMissS : flowAtlasMissC;
      if (miss && flowFrames % 30 === 0 && flowFrames < 900) flowGLUpload(flowSquare, true);
      else flowGLUpload(flowSquare);
    }
    if (!glTexC && !glTexS) return false;
    flowGLResize();
    const tex = flowSquare ? glTexS : glTexC;
    if (!tex) return false;
    const d = glInstData;
    let n = 0;
    for (let i = 0; i < people.length; i++) {
      const p = people[i];
      const a = p.rop;
      if (a < 0.02 || p.rs < 1) continue;
      const k = n * 10;
      d[k] = p.x + (p._bx || 0); d[k + 1] = p.y + (p._by || 0); d[k + 2] = p.rs;
      d[k + 3] = p.rot * Math.PI / 180; d[k + 4] = Math.min(1, a);
      d[k + 5] = (i % 25) / 25; d[k + 6] = Math.floor(i / 25) / 24;
      const tk = p._tgtK;
      if (flowSquare && flowSlotColor && tk != null && tk >= 0) {
        d[k + 7] = flowSlotColor[tk * 3] / 255;
        d[k + 8] = flowSlotColor[tk * 3 + 1] / 255;
        d[k + 9] = flowSlotColor[tk * 3 + 2] / 255;
      } else { d[k + 7] = d[k + 8] = d[k + 9] = 0.5; }
      n++;
    }
    // 画布模式下 extras 由 WebGL 直接画（CSS 已把它们隐藏），保证高精度格网完整
    if (flowExtrasShown && flowSquare && flowExtraSlots.length) {
      for (let e = 0; e < flowExtraSlots.length; e++) {
        const m = flowExtraSlots[e].m, slot = flowExtraSlots[e].slot, sk = flowExtraSlots[e].k;
        const k = n * 10;
        d[k] = slot.x; d[k + 1] = slot.y; d[k + 2] = flowSz;
        d[k + 3] = 0; d[k + 4] = 1;
        d[k + 5] = (m % 25) / 25; d[k + 6] = Math.floor(m / 25) / 24;
        if (flowSlotColor && sk != null && sk >= 0) {
          d[k + 7] = flowSlotColor[sk * 3] / 255;
          d[k + 8] = flowSlotColor[sk * 3 + 1] / 255;
          d[k + 9] = flowSlotColor[sk * 3 + 2] / 255;
        } else { d[k + 7] = d[k + 8] = d[k + 9] = 0.5; }
        n++;
      }
    }
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(glProg);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform2f(glResLoc, flowGlCv.width, flowGlCv.height);
    gl.uniform1f(glSqLoc, flowSquare ? 1 : 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, glInstBuf);
    gl.bufferData(gl.ARRAY_BUFFER, d.subarray(0, n * 10), gl.DYNAMIC_DRAW);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, n);   // 淡出的实例 alpha=0
    return true;
  }

  // 开/关画布渲染兜底：WebGL 不可用时保持 DOM 渲染，不强行降级
  function flowSetCanvasMode(on) {
    if (on) {
      flowGLInit();
      if (!glReady) return;
    }
    flowCanvasMode = on;
    if (on) flowEverCanvas = true;   // 记住本会话判定过帧率不足，下次进星流免探测直接画布渲染
    document.body.classList.toggle('flow-canvas', on);
    if (on) {
      flowGLUpload(flowSquare);
      flowGLResize();
      flowSizeCanvas(0.45);
    } else {
      flowSizeCanvas(0.5);
      if (glReady) { gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); }
      // 回到 DOM 渲染：清掉缓存，让下一帧重新写 transform
      people.forEach(function (p) { p._lastT = ''; p._lastOp = ''; });
    }
  }

  // 流场每帧只在 13×9 的粗网格上取噪声，再按双线性插值给每个人用，省掉 1000+ 次噪声计算
  const FLOW_GX = 12, FLOW_GY = 8;
  const FLOW_PW = FLOW_GX + 3;                 // 势函数多算一圈边界，供中心差分取旋度
  const flowPot = new Float32Array(FLOW_PW * (FLOW_GY + 3));
  const flowField = new Float32Array((FLOW_GX + 1) * (FLOW_GY + 1) * 2);
  let ffA = 0, ffB = 0;
  // 真正的 curl noise：速度场取自标量势函数的旋度（vx=∂ψ/∂y，vy=-∂ψ/∂x），
  // 这样场是无源的，600 个点不会像用两组独立噪声那样被吸成几团。
  function flowUpdateField(t) {
    for (let j = -1; j <= FLOW_GY + 1; j++) {
      for (let i = -1; i <= FLOW_GX + 1; i++) {
        const fx = (i / FLOW_GX) * flowW * flowPx + t * 0.16;
        const fy = (j / FLOW_GY) * flowH * flowPy + t * 0.12;
        flowPot[(j + 1) * FLOW_PW + (i + 1)] = flowNoise(fx, fy);
      }
    }
    for (let j = 0; j <= FLOW_GY; j++) {
      for (let i = 0; i <= FLOW_GX; i++) {
        const c = (j + 1) * FLOW_PW + (i + 1);
        const k = (j * (FLOW_GX + 1) + i) * 2;
        flowField[k] = (flowPot[c + FLOW_PW] - flowPot[c - FLOW_PW]) * 2.4;     // vx
        flowField[k + 1] = (flowPot[c - 1] - flowPot[c + 1]) * 2.4;             // vy
      }
    }
  }
  function flowFieldAt(x, y) {
    let gx = x / flowW * FLOW_GX, gy = y / flowH * FLOW_GY;
    if (gx < 0) gx = 0; else if (gx > FLOW_GX - 0.001) gx = FLOW_GX - 0.001;
    if (gy < 0) gy = 0; else if (gy > FLOW_GY - 0.001) gy = FLOW_GY - 0.001;
    const i0 = gx | 0, j0 = gy | 0, fx = gx - i0, fy = gy - j0;
    const k00 = (j0 * (FLOW_GX + 1) + i0) * 2, k10 = k00 + 2;
    const k01 = k00 + (FLOW_GX + 1) * 2, k11 = k01 + 2;
    const a0 = flowField[k00] + (flowField[k10] - flowField[k00]) * fx;
    const a1 = flowField[k01] + (flowField[k11] - flowField[k01]) * fx;
    const b0 = flowField[k00 + 1] + (flowField[k10 + 1] - flowField[k00 + 1]) * fx;
    const b1 = flowField[k01 + 1] + (flowField[k11 + 1] - flowField[k01 + 1]) * fx;
    ffA = a0 + (a1 - a0) * fy;
    ffB = b0 + (b1 - b0) * fy;
  }

  // 自由流动：curl-noise 流场 + 鼠标涡旋
  function flowFreeFrame(t) {
    const drift = 0.9;
    flowUpdateField(t);
    // 环面回绕：出界就从另一侧（舞台外留 44px 隐藏带）进来。
    // 用反射会让人在墙边越积越多，只有回绕才能保持密度均匀。
    const pad = 44, x0 = -pad, sx = flowW + pad * 2;
    const y0 = 96, y1 = Math.max(y0 + 120, flowH - FLOW_BAR_H - 6);
    const sy = y1 - y0;
    people.forEach(function (p) {
      flowFieldAt(p.x, p.y);
      let vx = ffA * drift, vy = ffB * drift;
      if (flowMouse) {
        const dx = p.x - flowMouse.x, dy = p.y - flowMouse.y;
        const d2 = dx * dx + dy * dy;
        const R = 170;
        if (d2 < R * R) {
          const d = Math.sqrt(d2) + 0.001;
          const k = (1 - d / R) * 90;      // 越近推力越强
          // 涡旋切向 + 轻微外推
          vx += (-dy / d) * k * 0.9 + (dx / d) * k * 0.35;
          vy += (dx / d) * k * 0.9 + (dy / d) * k * 0.35;
        }
      }
      // 从收束态回到自由态时给一段分散初速，避免原地堆成旧的文字/名画轮廓
      if (p._kick > 0) {
        vx += p._kx * p._kick;
        vy += p._ky * p._kick;
        p._kick *= 0.94;
        if (p._kick < 0.02) { p._kick = 0; p._kx = 0; p._ky = 0; }
      }
      p.x += vx * p._spd;
      p.y += vy * p._spd;
      p._mv = Math.abs(vx * p._spd) + Math.abs(vy * p._spd);
      if (p.x < x0) p.x += sx; else if (p.x >= x0 + sx) p.x -= sx;
      if (p.y < y0) p.y += sy; else if (p.y >= y0 + sy) p.y -= sy;
      p.rot += p._spin;
      p.rs += (p._baseSz - p.rs) * 0.1;
      p.rop += (1 - p.rop) * 0.14;
      p._bx = 0; p._by = 0;
      p.rx = p.x; p.ry = p.y;
      flowWrite(p, false);
    });
  }

  // 收束帧：所有收束状态共用同一套缓动，谁有槽谁飞过去，没有的淡出
  function flowSeekFrame() {
    const slots = flowSlots || [];
    people.forEach(function (p, i) {
      const s = slots[i];
      const ox = p.x, oy = p.y;
      if (s) {
        p._hole = false;
        p.x += (s.x - p.x) * 0.13;
        p.y += (s.y - p.y) * 0.13;
        p.rop += (1 - p.rop) * 0.14;
      } else {
        p._hole = true;
        p.x += (p._gx - p.x) * 0.12;
        p.y += (p._gy - p.y) * 0.12;
        p.rop *= 0.88;
      }
      p.rot *= 0.86;
      p.rs += (flowSz - p.rs) * 0.12;
      // 停留阶段：±0.9px 的极轻微呼吸，避免收束后像一张死图
      const ph = flowT * 1.5 + p.index * 0.43;
      p._bx = Math.sin(ph) * 0.9;
      p._by = Math.cos(ph * 0.77) * 0.9;
      p._mv = Math.abs(p.x - ox) + Math.abs(p.y - oy);
      p.rx = p.x; p.ry = p.y;
      flowWrite(p, flowSquare);
    });
  }

  // 单帧推进
  function flowStep(dt) {
    if (flowState === 'free') flowFreeFrame(flowT);
    else flowSeekFrame();
    flowTrail(dt);
  }

  function flowTick(ts) {
    if (mode !== 'flow' || document.hidden) { flowRaf = null; return; }
    if (!flowLast) flowLast = ts;
    let dt = (ts - flowLast) / 1000;
    flowLast = ts;
    if (dt > 0.08) dt = 0.08;
    flowT += dt;
    if (!flowStartTs) flowStartTs = ts;
    flowFrames++;
    // 用真实窗口统计帧率，避免首帧异常值污染判断
    if (!flowPerfChecked && ts - flowStartTs > 700) {
      flowPerfChecked = true;
      flowFps = flowFrames * 1000 / Math.max(1, ts - flowStartTs);
      if (flowFps < 48 && !flowCanvasMode) flowSetCanvasMode(true);   // 帧率不足：切画布渲染（已在画布模式则不重复切）
    }
    flowStep(dt);
    flowRaf = requestAnimationFrame(flowTick);
  }


  /* --------- 文字收束：复用 textSlots 栅格化 --------- */
  function flowTextSlots(txt) {
    const top = 102, bottom = FLOW_BAR_H + 8;
    const avH = Math.max(120, flowH - top - bottom);
    const res = textSlots(txt, flowW, avH, people.length);
    // textSlots 返回的坐标相对可用区，这里平移到顶部标题以下的区域
    return {
      slots: res.slots.map(function (s) { return { x: s.x, y: s.y + top }; }),
      cell: res.cell
    };
  }

  function flowSetNote(html) { flowNote.innerHTML = html || ''; }

  function flowApplyText(txt) {
    txt = (txt || '').trim().slice(0, 12);
    if (!txt) { flowBackToFree(); return; }
    clearTimeout(flowApplyTimer); flowApplyTimer = null; flowApplyTries = 0;
    const res = flowTextSlots(txt);
    if (!res.slots.length) { flowSetNote('这个字拼不出槽位，换一两个字试试'); return; }
    flowPreset = null;
    flowImage = null; flowImageName = '';
    flowHideExtras();
    flowWho = null; flowGrid = null; flowExtraSlots = []; flowSlotColor = null;
    flowClearTints();
    document.body.classList.remove('flow-image', 'flow-preset');
    people.forEach(function (p) { p.rot = 0; });
    flowAssignText(res);
    flowState = 'text';
    flowSquare = false;
    flowSetNote('已收束成「<b>' + txt + '</b>」 · ' + res.slots.length + ' 个槽位');
    if (REDUCED) flowRedrawStatic();
    else if (!flowRaf) { flowLast = 0; flowRaf = requestAnimationFrame(flowTick); }
  }

  // 文字槽位按索引依次分配：600 人里分不到槽位的淡出
  function flowAssignText(res) {
    const slots = new Array(people.length).fill(null);
    for (let i = 0; i < people.length && i < res.slots.length; i++) slots[i] = res.slots[i];
    flowSlots = slots;
    flowSz = Math.max(10, res.cell * 0.96);
  }

  // 回到自由流动：槽位/洞位/收束坐标全部失效，重新分散并给一段初速
  function flowBackToFree() {
    flowState = 'free';
    flowSlots = null;
    flowSquare = false;
    flowPreset = null;
    flowImage = null; flowImageName = '';
    flowGrid = null; flowWho = null; flowExtraSlots = []; flowSlotColor = null;
    clearTimeout(flowApplyTimer); flowApplyTimer = null; flowApplyTries = 0;
    flowHideExtras();
    document.body.classList.remove('flow-image', 'flow-preset');
    flowClearTints();
    renderFlowGallery();
    flowSetNote('自由星流 · 移动鼠标试试涡旋');
    const x0 = 70, x1 = flowW - 70;
    const y0 = 110, y1 = Math.max(y0 + 120, flowH - FLOW_BAR_H - 16);
    people.forEach(function (p) {
      // 彻底脱离原槽位：重新散布到整片流场
      p.x = x0 + flowRandom(p, 171) * (x1 - x0);
      p.y = y0 + flowRandom(p, 172) * (y1 - y0);
      p._gx = x0 + flowRandom(p, 75) * (x1 - x0);
      p._gy = y0 + flowRandom(p, 76) * (y1 - y0);
      p._hole = false; p._mv = 0;
      p._kick = 1;
      p._kx = (flowRandom(p, 173) - 0.5) * 4;
      p._ky = (flowRandom(p, 174) - 0.5) * 4;
      p.rop = Math.max(p.rop, 0.2);
      p._bx = 0; p._by = 0;
      p.rx = p.x; p.ry = p.y;
      p._lastT = '';
    });
    flowTrailClear(true);
    if (REDUCED) flowRedrawStatic();
    else if (!flowRaf) { flowLast = 0; flowRaf = requestAnimationFrame(flowTick); }
  }

  /* --------- 图片 / 预设收束：多档分辨率，成员可复用 --------- */
  function flowApplyTarget(tgt, square, note, srcPreset) {
    if (!tgt) return;
    // 配色没准备好就推迟匹配，避免默认灰 128 退化成满屏杂色
    if (!flowColorsReady() && flowApplyTries < 20) {
      flowApplyTries++;
      flowEnsureColors();
      flowSetNote('正在准备配色…');
      clearTimeout(flowApplyTimer);
      flowApplyTimer = setTimeout(function () { flowApplyTarget(tgt, square, note, srcPreset); }, 500);
      return;
    }
    flowApplyTries = 0;
    flowDbgTgt = tgt;
    const grid = flowGridSlots(flowW, flowH, flowCols, flowRows);
    flowAssign(tgt, grid);
    if (square) flowApplyTints();
    flowSquare = square;
    flowPreset = srcPreset || null;
    document.body.classList.toggle('flow-image', !!square);
    document.body.classList.toggle('flow-preset', !!srcPreset);
    flowSetNote(note || '');
    renderFlowGallery();
    flowTrailClear(true);   // 收束前清掉自由流动的拖尾，避免旧轨迹糊在新画上
    flowExtrasSoon();
    if (REDUCED) flowRedrawStatic();
    else if (!flowRaf) { flowLast = 0; flowRaf = requestAnimationFrame(flowTick); }
  }

  function flowApplyPreset(preset) {
    clearTimeout(flowApplyTimer); flowApplyTimer = null; flowApplyTries = 0;
    flowPresetColors(preset, flowCols, flowRows, function (tgt) {
      if (mode !== 'flow') return;
      if (!tgt) { flowSetNote('预设图解码失败，当前画面保持不变'); return; }
      flowState = 'preset';
      flowApplyTarget(tgt, true,
        '已收束到「<b>' + preset.name + '</b>」 · ' + preset.author + '《' + preset.name + '》' +
        (preset.year ? ' ' + preset.year : '') + ' · ' + preset.license + ' · ' + flowCellCount + ' 格', preset);
    });
  }

  // 读图 → cover 裁切 → 当前档位 cols×rows → 最近色匹配
  function flowApplyImage(im, name) {
    clearTimeout(flowApplyTimer); flowApplyTimer = null; flowApplyTries = 0;
    if (!im || !im.naturalWidth || !im.naturalHeight) { flowSetNote('图片解码失败，当前画面保持不变'); return; }
    if (im.naturalWidth < 8 || im.naturalHeight < 8) { flowSetNote('图片太小（小于 8px），当前画面保持不变'); return; }
    const tgt = flowSampleImage(im, flowCols, flowRows);
    if (!tgt) { flowSetNote('图片太小或无法裁切，当前画面保持不变'); return; }
    flowImage = im; flowImageName = name || '';
    flowState = 'image';
    flowApplyTarget(tgt, true, '已收束到「<b>' + (name || '图片') + '</b>」 · ' + flowCellCount + ' 格最近色匹配');
  }

  function flowApplyImageFile(file) {
    if (!file) return;
    if (!/^image\//.test(file.type)) { flowSetNote('这不是图片文件，当前画面保持不变'); return; }
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = function () {
      URL.revokeObjectURL(url);
      if (mode !== 'flow') return;
      flowApplyImage(im, file.name || '图片');
    };
    im.onerror = function () {
      URL.revokeObjectURL(url);
      flowSetNote('图片解码失败，当前画面保持不变');
    };
    im.src = url;
  }

  /* --------- 预设画廊 --------- */
  let flowGalleryBuilt = false;   // 画廊 DOM 只构建一次，之后仅刷新选中高亮，不再反复重建

      const im = document.createElement('img');
      im.src = preset.src; im.alt = preset.name;
      const nm = document.createElement('span');
      nm.textContent = preset.name;
      item.appendChild(im); item.appendChild(nm);
      item.addEventListener('click', function () {

  /* ================= 版式五：星流（入口） ================= */
  function layoutFlow() {
    const g = flowGeom();
    const entering = document.body.dataset.mode !== 'flow';
    flowW = g.W; flowH = g.H;
    lastSz = g.sz;
    if (entering) {
      // 只在真正切进来时重建人和状态；已经被 apply() 再次调用（尺寸变化等）时保持当前画面
      flowSetLevelUI();
      flowSz = g.sz;
      flowInitPeople(g.W, g.H, g.sz);
      flowState = 'free';
      flowSlots = null;
      flowSquare = false;
      flowPreset = null;
      flowImage = null; flowImageName = '';
      flowGrid = null; flowWho = null; flowExtraSlots = [];
      flowHideExtras();
      document.body.classList.remove('flow-image', 'flow-preset');
      // 本会话已判定过帧率不足：直接走画布渲染，省掉前 ~0.7s DOM 模式的掉帧窗口
      if (flowEverCanvas) flowSetCanvasMode(true);
      else if (flowCanvasMode) flowSetCanvasMode(false);   // 其余情况回到 DOM 模式重新评估帧率
      flowSetNote('自由星流 · 移动鼠标试试涡旋');
      renderFlowGallery();
    }
    document.body.dataset.mode = 'flow';
    flowSizeCanvas(flowCanvasMode ? 0.45 : 0.5);
    flowEnsureColors();
    people.forEach(function (p) { flowWrite(p, flowSquare); });
    return { W: g.W, H: g.H, sz: g.sz, showNames: false, apexY: Math.round(g.H * 0.9), sphere: null };
  }

  // 每秒只重排真正改变坐标的头像（未变的保持不动）
  function countdownFrame() {
    const L = layoutCountdown();
    const half = L.sz / 2;
    people.forEach(function (p) {
      p.rx = p.x; p.ry = p.y;
      const t = 'translate(' + (p.x - half).toFixed(2) + 'px,' + (p.y - half).toFixed(2) + 'px) rotate(' + p.rot.toFixed(2) + 'deg)';

  /* ================= 社区纽带：连线 ================= */
  function computeEdges() {
    const edges = [], seen = new Set(), n = people.length;
    if (n < 3) return edges;
    const maxD = Math.max(90, lastSz * 3.6);
    const maxD2 = maxD * maxD;
    // 空间网格：以 maxD 为格宽分桶，每个点只在 3×3 邻域找最近两点，代替 O(n²) 全量两两配对。
    // 邻域外的点 |dx| 或 |dy| 必 > maxD，本就会被 maxD2 剪掉，候选集不变；
    // 原实现按 j 升序遍历、严格小于比较，等价于按 (距离, j) 字典序取最小/次小——
    // 这里显式用 (dd, j) 决胜，与遍历顺序无关，结果与原版逐位一致。
    const cell = maxD;
    const grid = new Map();
    const gcx = new Int32Array(n), gcy = new Int32Array(n);
    for (let i = 0; i < n; i++) {
      gcx[i] = Math.floor(people[i].x / cell);
      gcy[i] = Math.floor(people[i].y / cell);
      const k = gcx[i] * 1024 + gcy[i];        // |gy| < 512 时键唯一
      let b = grid.get(k);
      if (!b) { b = []; grid.set(k, b); }
      b.push(i);
    }
    for (let i = 0; i < n; i++) {
      let b1 = -1, d1 = Infinity, b2 = -1, d2 = Infinity;
      const ci = people[i].cluster;
      const cix = gcx[i], ciy = gcy[i];
      for (let oy = -1; oy <= 1; oy++) {
        for (let ox = -1; ox <= 1; ox++) {
          const b = grid.get((cix + ox) * 1024 + (ciy + oy));
          if (!b) continue;
          for (let q = 0; q < b.length; q++) {
            const j = b[q];
            if (j === i) continue;
            if (ci != null && people[j].cluster !== ci) continue;
            const dx = people[j].x - people[i].x, dy = people[j].y - people[i].y;
            const dd = dx * dx + dy * dy;
            if (dd > maxD2) continue;
            if (dd < d1 || (dd === d1 && j < b1)) { d2 = d1; b2 = b1; d1 = dd; b1 = j; }
            else if (dd < d2 || (dd === d2 && j < b2)) { d2 = dd; b2 = j; }
          }
        }
      }
      [b1, b2].forEach(function (b) {
        if (b < 0) return;
        const key = i < b ? i + ':' + b : b + ':' + i;
        if (seen.has(key)) return;
        seen.add(key);
        edges.push([i, b]);
      });
      if (edges.length > 1500) break;
    }
    return edges;
  }

  function linkCtl(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.max(1, Math.hypot(dx, dy));
    const bow = Math.min(9, len * 0.09) * (Math.round(a.y) % 2 ? 1 : -1);
    return [(a.x + b.x) / 2 - (dy / len) * bow, (a.y + b.y) / 2 + (dx / len) * bow];
  }

  function buildLinks(W, H) {
    linkAll.setAttribute('d', '');
    linkHot.setAttribute('d', '');
    personLinks = people.map(function () { return []; });
    edgesD = '';
    if (mode !== 'constellation') return;
    linkSvg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    const parts = [];
    computeEdges().forEach(function (e) {
      const pa = people[e[0]], pb = people[e[1]];
      const c = linkCtl(pa, pb);
      const d = 'M' + pa.x.toFixed(1) + ' ' + pa.y.toFixed(1) +
        ' Q' + c[0].toFixed(1) + ' ' + c[1].toFixed(1) + ' ' + pb.x.toFixed(1) + ' ' + pb.y.toFixed(1);
      parts.push(d);
      personLinks[e[0]].push(d);
      personLinks[e[1]].push(d);
    });
    edgesD = parts.join(' ');
    linkAll.setAttribute('d', edgesD);
  }

  function highlightLinks(idx, on) {
    if (mode !== 'constellation') return;
    const list = personLinks[idx];
    if (on && list && list.length) linkHot.setAttribute('d', list.join(' '));
    else linkHot.setAttribute('d', '');
  }

  /* ================= 应用版式 ================= */
  // 错峰飞行的过渡窗口（最长 0.9s 过渡 + 120ms 延迟）：期间给 body 挂 p-moving 降级绘制，
  // 到点自动摘除恢复原样；连续切 tab 时重新计时
  let pMovingT = null;
  function pMoving(on) {
    clearTimeout(pMovingT); pMovingT = null;
    if (on) {
      document.body.classList.add('p-moving');
      pMovingT = setTimeout(function () { document.body.classList.remove('p-moving'); pMovingT = null; }, 1100);
    } else {
      document.body.classList.remove('p-moving');
    }
  }

  function apply() {
    const vpClientW = viewport.clientWidth;   // 读写分离：测量集中在 600 次样式写入之前，写后不再回头读
    pMoving(false);
    stopGlobe();
    if (mode !== 'flow') flowStop();
    document.body.classList.remove('lit');
    linkSvg.style.display = mode === 'constellation' ? '' : 'none';

    const L = heroOn ? layoutHero()
            : mode === 'constellation' ? layoutConstellation()
            : mode === 'globe' ? layoutGlobe()
            : mode === 'flow' ? layoutFlow()
            : mode === 'countdown' ? layoutCountdown()
            : layoutPixel();

    stageW = L.W; stageH = L.H;
    stage.style.width = L.W + 'px';
    stage.style.height = L.H + 'px';
    stage.style.setProperty('--sz', L.sz + 'px');
    banner.style.display = L.H < 170 ? 'none' : '';
    document.body.dataset.mode = heroOn ? 'hero' : mode;

    if (fxActive) { sizeFx(); fxCv.style.display = 'block'; }   // 烟花在放时跟着新舞台尺寸走

    // 星流形态里 #bg 被 CSS 隐藏（它自带渐变底），跳过这次不可见的全幅重绘；
    // 离开星流时 bgPaintKey 命中旧缓存或按新尺寸重绘，视觉无缝
    if (heroOn || mode !== 'flow') paintBackdrop(L.W, L.H, { apexY: L.apexY, sphere: L.sphere });

    if (mode === 'globe') {
      globeCv.style.display = 'block';
      resizeGlobeCanvas();
      startGlobe();
    } else {
      globeCv.style.display = 'none';
      globeCtx.setTransform(1, 0, 0, 1, 0, 0);
      globeCtx.clearRect(0, 0, globeCv.width, globeCv.height);
      const nmOp = L.showNames ? 1 : 0;
      const isFlow = !heroOn && mode === 'flow';
      if (!heroOn && !isFlow) pMoving(true);   // 错峰飞行的过渡窗口开启降级（主角模式自带无阴影样式、星流逐帧接管，均不适用）
      people.forEach(function (p, i) {
        p.el.style.opacity = '';
        p.el.style.zIndex = '';
        p.el.style.setProperty('--nm-op', nmOp);
        if (heroOn) return;                 // 主角模式的落位交给 heroFrame()
        if (isFlow) { p._lastOp = ''; return; }   // 星流落位由流场逐帧接管；行内透明度刚被清成 ''，同步 flowWrite 的写入缓存，否则值不变就不回写、透明度短暂失真
        p.el.style.transitionDelay = Math.min(i % 40, 40) * 3 + 'ms';
        p.el.style.removeProperty('--sz');
        p.rx = p.x; p.ry = p.y; p.rk = 1; p.rd = 0; p.rs = L.sz;
        const half = L.sz / 2;
        const t = 'translate(' + (p.x - half).toFixed(2) + 'px,' + (p.y - half).toFixed(2) + 'px) rotate(' + p.rot.toFixed(2) + 'deg)';
        if (p._lastT !== t) { p.el.style.transform = t; p._lastT = t; }   // 目标值没变就不重写，跳过无谓的过渡触发
      });
      if (heroOn) heroFrame();
      if (isFlow) flowStart();
      buildLinks(L.W, L.H);
    }

    fitScale = Math.min(1, (vpClientW - 36) / L.W);   // 用写入前测好的值，避免 600 次样式写入后强制同步排版
    applyZoom();
  }

  function applyZoom() {
    const z = fitScale * userZoom;
    stage.style.transform = 'scale(' + z + ')';
    zoomWrap.style.width = (stageW * z) + 'px';
    zoomWrap.style.height = (stageH * z) + 'px';
    if (mode === 'globe') {
      const want = currentDpr();
      if (Math.abs(want - dprEff) > 0.15) { resizeGlobeCanvas(); drawGlobeFrame(); }
    }
  }

  /* ================= 搜索 ================= */
  let hits = [];
  function doSearch() {
    const v = q.value.trim().toLowerCase();
    searchBox.classList.toggle('has-value', !!q.value);
    people.forEach(function (p) { p.el.classList.remove('hit'); });
    hits = [];
    hitSet = new Set();
    heroBtn.style.display = 'none';
    if (!v) {
      hitInfo.textContent = '';
      // 清空搜索框：倒计时 tab 里若正被搜索锁定，回到轮播
      if (mode === 'countdown' && heroSearchIdx >= 0) { heroSearchIdx = -1; unlockHero(); }
      return;
    }

    people.forEach(function (p) {
      if (p.n.toLowerCase().indexOf(v) >= 0 || p.u.toLowerCase().indexOf(v) >= 0) {
        p.el.classList.add('hit');
        hits.push(p);
        hitSet.add(p.index);
      }
    });
    if (hits.length) {
      hitInfo.textContent = '找到 ' + hits.length + ' 位 · 已定位到第 1 位';
      centerOn(hits[0]);
    } else {
      hitInfo.textContent = '没找到「' + q.value.trim() + '」，试试用户名';
    }
    heroBtn.style.display = hits.length ? '' : 'none';

    // 在倒计时 tab 里搜到谁，谁就当主角；清空搜索则回到轮播
    if (mode === 'countdown') {
      if (hits.length) {
        if (hits[0].index !== heroSearchIdx) { heroSearchIdx = hits[0].index; lockHero(hits[0].index); }
      } else if (heroSearchIdx >= 0) {
        heroSearchIdx = -1;
        unlockHero();
      }
    }
  }

  function centerOn(p) {
    if (heroOn) return;                       // 主角秀里不滚动，浪费动作
    if (mode === 'globe') { globeFocus(p); return; }
    const z = fitScale * userZoom;
    viewport.scrollTo({
      left: p.x * z - viewport.clientWidth / 2,
      top: p.y * z - viewport.clientHeight / 2,
      behavior: 'smooth'
    });
  }

  q.addEventListener('input', doSearch);
  clearBtn.addEventListener('click', function () { q.value = ''; doSearch(); q.focus(); });

  /* ================= 悬停 ================= */
  let hoverIdx = -1, lastMoveT = 0;
  function positionTip(cx, cy) {

  stage.addEventListener('pointerdown', function (e) {
    if (mode !== 'globe') return;
    dragging = true; globeAuto = false; globe.target = null;
    dragX = e.clientX; dragY = e.clientY;
    dragY0 = globe.rotY; dragX0 = globe.rotX;

    if (!globeRaf) globeRaf = requestAnimationFrame(globeTick);
  });
  stage.addEventListener('pointermove', function (e) {
    if (!dragging || mode !== 'globe') return;

  });
  function endDrag() {
    if (!dragging) return;

    stage.classList.remove('dragging');

  }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
  stage.addEventListener('pointerleave', endDrag);

  /* ================= 切换形态 ================= */
  function syncModeButtons() {
    Array.prototype.forEach.call(modesBar.children, function (c) {
      c.classList.toggle('on', c.dataset.mode === mode);
    });
  }

  function setMode(next, flashIt) {
    if (next === mode) return;
    // 离开倒计时 tab 时若主角秀还在演，必须"彻底收场"：只把 heroOn 置 false
    // 会让复用补位的附加节点留在场上、定时器也不释放，切回来后轮播还会被 heroLocked 卡死。
    if (heroOn) { clearTimeout(heroPhaseT); heroOn = false; heroHideExtras(); }
    heroLocked = false;
    heroSearchIdx = -1;
    clearTimeout(heroWheel);
    mode = next;
    syncModeButtons();
    if (mode === 'globe') { globeAuto = !REDUCED; globe.target = null; }
    // 重启快门动画：用只刷样式的 getComputedStyle 代替 void offsetWidth，不再强制整页同步排版
    if (flashIt !== false) { flash.classList.remove('on'); void getComputedStyle(flash).opacity; flash.classList.add('on'); }
    apply();
    if (mode === 'countdown') {
      // 回到倒计时：搜索框里还有命中，就继续把 TA 锁成主角；否则恢复轮播
      if (q.value.trim() && hits.length) { heroSearchIdx = hits[0].index; lockHero(hits[0].index); }
      else if (on1024Day()) { heroIdx = (heroIdx + 1) % people.length; enterHero(heroIdx, false); }  // 当天这个 tab 就是主角秀，直接起场
      else carouselKick();
    } else {
      if (hits.length) setTimeout(function () { centerOn(hits[0]); }, 500);
    }
    viewport.scrollTo({ top: 0, left: (mode === 'pixel' || mode === 'countdown' || mode === 'flow') ? 0 : viewport.scrollLeft, behavior: 'smooth' });
  }

  modesBar.addEventListener('click', function (e) {
    const b = e.target.closest('button[data-mode]');
    if (!b || b.disabled) return;
    setMode(b.dataset.mode);
  });

  zoomInput.addEventListener('input', function () {
    userZoom = Number(zoomInput.value);
    applyZoom();
  });

  window.addEventListener('resize', function () {

    apply();
    if (keep) { q.value = keep; doSearch(); }

  /* ================= 导出 PNG ================= */
  btnShot.addEventListener('click', function () {
    btnShot.disabled = true;
    btnShot.textContent = '正在冲洗…';
